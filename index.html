<script>
/* Syllabus chapter 1: Course Overview. Course information, instructor, description,
   learning outcomes with their measures, materials and course approach.
   Standardized content comes from the course catalog and program records (Setup tabs);
   this component holds only what the instructor chooses. Covers BPPE §71710(a)(3)
   elements A, B, C, D (meeting pattern), E and G. */
GEN.registerComponent({
  id: 'syllabus-overview',
  order: 10,
  name: 'Syllabus 1: Course Overview',
  version: '1.2',
  description: 'First syllabus chapter: course information, instructor, description, learning outcomes and how they are measured, materials and course approach. Description, outcomes, credits and hours come from the Course catalog tab.',
  placement: 'Syllabus Book, chapter 1 ("Course Overview"). Chapters: 1 Course Overview, 2 Assignments and Grading, 3 Course Schedule (paste the Course Calendar), 4 Course Policies and Resources, 5 Standardized KPSAHS Instructional Policies, 6 Clinical Competency Requirements (clinical courses). Paste in the Source code view.',
  fields: [
    { key: 'noRequiredTexts', label: 'This course has no required textbook', type: 'checkbox', default: false },
    { key: 'requiredTexts', label: 'Required textbooks', type: 'list', itemLabel: 'Textbook', showIf: '!noRequiredTexts',
      help: 'Complete citations are required. Add each book the student must have.',
      fields: [
        { key: 'title', label: 'Title', type: 'text' },
        { key: 'author', label: 'Author(s)', type: 'text', placeholder: 'e.g., Hagen-Ansert, S. L.' },
        { key: 'edition', label: 'Edition', type: 'text', placeholder: 'e.g., 9th ed.' },
        { key: 'publisher', label: 'Publisher', type: 'text' },
        { key: 'year', label: 'Year', type: 'text' },
        { key: 'isbn', label: 'ISBN', type: 'text' }
      ] },
    { key: 'otherMaterials', label: 'Other required materials (optional, one per line)', type: 'textarea', help: 'Equipment, handbooks, software, uniforms. Give an edition or year for written materials.' },
    { key: 'supplemental', label: 'Optional or supplemental materials (optional, one per line)', type: 'textarea', help: 'Week-by-week readings belong in the weekly sections; list only course-wide extras here.' },
    { key: 'courseApproach', label: 'Course approach', type: 'textarea',
      help: 'How learning happens in this course: lecture, lab practice, clinical rotations, discussions, projects. A few sentences or one method per line. Separate paragraphs with a blank line.' },
    { key: 'showProgramOutcomes', label: 'Show the program learning outcomes', type: 'checkbox', default: false,
      help: 'Lists the program outcomes from the Programs tab under the course outcomes, so students see how the course fits the program.' },
    { key: 'showObjectives', label: 'Also show the course objectives from the catalog record', type: 'checkbox', default: false,
      help: 'Learning outcomes always show. Turn this on only if the program wants the course objectives listed too.' }
  ],
  sample: {
    noRequiredTexts: false,
    requiredTexts: [{ title: 'Textbook of Clinical Echocardiography', author: 'Otto, C. M.', edition: '7th ed.', publisher: 'Elsevier', year: '2023', isbn: '9780323935357' }],
    otherMaterials: 'KPSAHS Student Handbook (2026)\nClinical uniform and ID badge',
    supplemental: '',
    courseApproach: 'Through assigned clinical rotations, you will observe, assist with, and then perform standard sonographic procedures under the direct supervision of a qualified sonographer.\n\nClinical site visits connect what you learned in class and the scan lab to patient care, and patient logs keep faculty and your clinical site in touch about your progress.',
    showObjectives: false
  },
  render(v, ctx, h) {
    const C = ctx.course || {}, S = ctx.school || {};
    const R = h.record(ctx), P = h.program(ctx);
    const BLUE = '#006ba6', SUB = 'color: #4a5560;';
    const H3 = `color: ${BLUE}; border-bottom: 2px solid ${BLUE}; padding-bottom: 4px; margin: 28px 0 10px;`;
    const TH = 'text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid #e3e8ec; color: #4a5560; font-size: 0.9em; width: 30%;';
    const TD = 'padding: 8px 10px; border-bottom: 1px solid #e3e8ec; vertical-align: top;';
    const THC = 'text-align: left; padding: 8px 10px; border-bottom: 2px solid #006ba6; color: #4a5560; font-size: 0.85em;';
    const A = (href, label, text) => `<a href="${h.url(href, label)}" style="color: ${BLUE}; font-weight: bold;">${text}</a>`;
    const row = (label, value) => `      <tr><th scope="row" style="${TH}">${label}</th><td style="${TD}">${value}</td></tr>`;
    const num = x => (x === '' || x == null || isNaN(Number(x))) ? null : Number(x);
    const title = h.blank(C.courseTitle) ? h.text(R.courseTitle, 'Course title (catalog)') : h.esc(C.courseTitle);
    const code = h.text(C.courseCode || R.courseCode, 'Course code');
    const type = R.courseType || '';
    const isClinical = /clinical/i.test(type);
    const isOnlineOnly = /^Online/.test(C.modality || '');

    /* hours: BPPE (C) length of the course */
    const hrs = [['Onsite', R.hoursOnsite], ['Online, synchronous', R.hoursSync], ['Online, asynchronous', R.hoursAsync]];
    const anyHrs = hrs.some(x => num(x[1]) != null);
    const total = hrs.reduce((t, x) => t + (num(x[1]) || 0), 0);
    const hasLab = !!R.hasLabCourse;
    const labCode = hasLab ? h.text(R.labCourseCode, 'Lab course code (catalog)') : '';
    const labHrs = num(R.labHours);
    const lecHtml = hrs.filter(x => num(x[1])).map(x => `${x[0]}: ${num(x[1])}`).join(' &nbsp;|&nbsp; ');
    const hoursHtml = !anyHrs ? h.text('', 'Scheduled hours (catalog)')
      : hasLab
        ? `${h.esc(R.courseCode)}: ${lecHtml || '0'}<br>${labCode}: ${labHrs != null ? 'Lab: ' + labHrs : h.text('', 'Lab hours (catalog)')}<br><strong>Total: ${Math.round((total + (labHrs || 0)) * 100) / 100} hours</strong>`
        : `${lecHtml} &nbsp;|&nbsp; <strong>Total: ${Math.round(total * 100) / 100} hours</strong>`;
    const creditsHtml = hasLab
      ? `${h.esc(R.courseCode)}: ${h.text(R.quarterCredits, 'Quarter credits (catalog)')} &nbsp;|&nbsp; ${labCode}: ${h.text(R.labQuarterCredits, 'Lab quarter credits (catalog)')}`
      : h.text(R.quarterCredits, 'Quarter credits (catalog)');

    /* meeting pattern: BPPE (D) sequence and frequency */
    const days = [C.meetingDay1, C.meetingDay2].filter(d => !h.blank(d)).map(h.esc).join(' and ');
    let meets;
    if (days) meets = `${days}, ${h.timeRange(C.meetingStart, C.meetingEnd, 'Class time')}`;
    else if (isClinical) meets = 'Scheduled clinical rotations at your assigned site (see the Course Schedule)';
    else meets = h.text('', 'Class day');
    const where = [];
    if (!isOnlineOnly) where.push(h.blank(C.room) ? (isClinical ? 'Assigned clinical site' : h.text('', 'Assigned room')) : h.esc(C.room));
    if (!h.blank(C.location)) where.unshift(h.esc(C.location));
    const labMeet = C.hasLabMeeting
      ? row(hasLab ? 'Lab meetings (' + labCode + ')' : 'Lab meetings',
          `${h.blank(C.labDay) ? h.text('', 'Lab day') : h.esc(C.labDay)}${(h.blank(C.labStart) && h.blank(C.labEnd) && !h.blank(C.labNote)) ? '' : ', ' + h.timeRange(C.labStart, C.labEnd, 'Lab time')}${h.blank(C.labRoom) ? '' : ', ' + h.esc(C.labRoom)}${h.blank(C.labNote) ? '' : `<br><span style="${SUB} font-size: 0.9em;">${h.esc(C.labNote)}</span>`}`)
      : '';
    const zoom = h.blank(C.zoomUrl) ? '' : row('Zoom', `${A(C.zoomUrl, 'Zoom meeting', 'Join Zoom meeting')}${h.blank(C.zoomId) ? '' : ' &nbsp;|&nbsp; Meeting ID: ' + h.esc(C.zoomId)}${h.blank(C.zoomPasscode) ? '' : '<br>Passcode: ' + h.esc(C.zoomPasscode)}`);
    const dates = (h.blank(C.startDate) && h.blank(C.endDate)) ? '' : ` (${h.date(C.startDate, 'full', 'First day of term')} to ${h.date(C.endDate, 'full', 'Last day of term')})`;

    const info = [
      row('Course', `${code}${hasLab ? ' and ' + labCode : ''}: ${title}`),
      row('Program', h.text(C.program || R.program, 'Program')),
      row('Course type', h.text(type, 'Course type (catalog)')),
      row('Modality', h.text(C.modality, 'Modality')),
      row('Quarter credits', creditsHtml),
      row('Scheduled hours', hoursHtml),
      row('Term', `${h.text(C.term, 'Term')}${dates}<br><span style="${SUB} font-size: 0.9em;">See the ${A(S.academicCalendarUrl, 'Academic calendar', 'KPSAHS academic calendar')} for quarter dates and deadlines.</span>`),
      row(C.hasLabMeeting ? 'Lecture meetings' : 'Class meetings', meets),
      labMeet,
      where.length ? row('Location', where.join(', ')) : '',
      zoom,
      row('Prerequisites', h.text(R.prerequisites, 'Prerequisites (catalog)')),
      row('Corequisites', h.text(R.corequisites, 'Corequisites (catalog)'))
    ].filter(Boolean).join('\n');

    /* instructor */
    const pron = h.blank(C.instructorPronouns) ? '' : ` <span style="${SUB}">(${h.esc(C.instructorPronouns)})</span>`;
    const instr = [
      row('Primary instructor', h.text(C.instructorName, 'Primary instructor name') + pron + (h.blank(C.instructorBioUrl) ? '' : `<br>${A(C.instructorBioUrl, 'Instructor bio', 'Instructor bio')}`)),
      row('Email', h.blank(C.instructorEmail) ? h.text('', 'Primary instructor email') : A(h.mailto(C.instructorEmail), 'Email', h.esc(C.instructorEmail))),
      h.blank(C.instructorPhone) ? '' : row('Phone', h.esc(C.instructorPhone)),
      row('Office hours', h.text(C.officeHours, 'Office hours')),
      ...(C.secondaryInstructors || []).filter(s => !h.blank(s.name)).map(s =>
        row('Secondary instructor', h.esc(s.name) + (h.blank(s.email) ? '' : ` &nbsp;|&nbsp; ${A(h.mailto(s.email), 'Email', h.esc(s.email))}`))),
      ...(isClinical ? (P.coordinators || []).filter(s => !h.blank(s.name)).map(s =>
        row(h.blank(s.role) ? 'Clinical coordinator' : h.esc(s.role), h.esc(s.name) +
          (h.blank(s.email) ? '' : ` &nbsp;|&nbsp; ${A(h.mailto(s.email), 'Email', h.esc(s.email))}`) +
          (h.blank(s.phone) ? '' : ` &nbsp;|&nbsp; ${h.esc(s.phone)}`))) : [])
    ].filter(Boolean).join('\n');

    /* outcomes: BPPE (B), and (F) how skills are measured */
    const outs = (R.outcomes || []).filter(o => !h.blank(o.outcome));
    outs.forEach((o, i) => { if (/\bunderstand(s|ing)?\b|\bknow\b|\bappreciate\b|\bbe aware\b/i.test(o.outcome)) h.warn(`Outcome ${i + 1} uses a verb that can't be measured (catalog record)`); });
    const outRows = outs.length
      ? outs.map((o, i) => `      <tr><td style="${TD} font-weight: bold; color: ${BLUE}; width: 6%;">${i + 1}</td><td style="${TD}">${h.lines(o.outcome)}</td><td style="${TD} width: 34%;">${h.text(o.measuredBy, `Measure for outcome ${i + 1} (catalog)`)}</td></tr>`).join('\n')
      : `      <tr><td style="${TD}">1</td><td style="${TD}">${h.text('', 'Learning outcomes (catalog)')}</td><td style="${TD}"></td></tr>`;
    const objectives = (v.showObjectives && !h.blank(R.objectives))
      ? `\n<h4 style="margin: 18px 0 6px; color: #1f2933;">Course Objectives</h4>\n<p style="margin: 0 0 6px;">This course is designed to:</p>\n<ul style="margin: 0 0 10px; padding-left: 22px;">\n${String(R.objectives).split(/\r?\n/).filter(x => x.trim()).map(x => `  <li style="margin: 0 0 4px;">${h.esc(x.trim())}</li>`).join('\n')}\n</ul>` : '';

    /* materials: BPPE (E) complete citations */
    const cite = t => {
      const parts = [];
      if (!h.blank(t.author)) parts.push(h.esc(t.author.trim().replace(/\.$/, '')) + '.');
      parts.push(h.blank(t.year) ? `(${h.text('', 'Textbook year')}).` : `(${h.esc(t.year)}).`);
      parts.push(`<em>${h.text(t.title, 'Textbook title')}</em>${h.blank(t.edition) ? '' : ' (' + h.esc(t.edition) + ')'}.`);
      parts.push(h.blank(t.publisher) ? h.text('', 'Textbook publisher') + '.' : h.esc(t.publisher) + '.');
      if (!h.blank(t.isbn)) parts.push('ISBN ' + h.esc(t.isbn) + '.');
      return parts.join(' ');
    };
    const texts = v.noRequiredTexts
      ? '<p style="margin: 0 0 8px;">No textbook is required for this course.</p>'
      : `<ul style="margin: 0 0 10px; padding-left: 22px;">\n${((v.requiredTexts || []).filter(t => !h.blank(t.title) || !h.blank(t.author)).map(t => `  <li style="margin: 0 0 6px;">${cite(t)}</li>`).join('\n')) || '  <li>' + h.text('', 'Required textbook') + '</li>'}\n</ul>`;
    const listOf = (txt, head) => h.blank(txt) ? '' : `\n<h4 style="margin: 14px 0 6px; color: #1f2933;">${head}</h4>\n<ul style="margin: 0 0 10px; padding-left: 22px;">\n${String(txt).split(/\r?\n/).filter(x => x.trim()).map(x => `  <li style="margin: 0 0 4px;">${h.esc(x.trim())}</li>`).join('\n')}\n</ul>`;

    const ploLines = String(P.learningOutcomes || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    const plo = (v.showProgramOutcomes && ploLines.length) ? `
<h4 style="margin: 18px 0 6px; color: #1f2933;">Program Learning Outcomes</h4>
<p style="margin: 0 0 6px;">This course contributes to the ${h.esc(P.name || 'program')} program learning outcomes:</p>
<ul style="margin: 0 0 10px; padding-left: 22px;">
${ploLines.map(x => `  <li style="margin: 0 0 4px;">${h.esc(x)}</li>`).join('\n')}
</ul>` : '';
    const ver = h.blank(C.syllabusVersion) ? '' : `Syllabus version ${h.esc(C.syllabusVersion)} &nbsp;|&nbsp; `;

    return `<div style="max-width: 860px; line-height: 1.55; color: #1f2933;">
<div style="background: ${BLUE}; padding: 14px 20px; border-radius: 8px; margin: 12px 0 8px;">
  <h3 style="margin: 0; color: #ffffff; font-size: 1.3em;">Course Syllabus</h3>
  <p style="margin: 2px 0 0; color: #ffffff; font-size: 0.95em;">${code}${hasLab ? ' and ' + labCode : ''}: ${title} &nbsp;|&nbsp; ${h.text(C.term, 'Term')}</p>
</div>
<p style="margin: 0 0 6px; ${SUB} font-size: 0.92em;">This syllabus is the official course outline. It is subject to change; changes are announced in the course.</p>

<h3 style="${H3}">Course Information</h3>
<table style="width: 100%; border-collapse: collapse; margin: 0 0 8px;">
  <tbody>
${info}
  </tbody>
</table>

<h3 style="${H3}">Instructor Information</h3>
<table style="width: 100%; border-collapse: collapse; margin: 0 0 8px;">
  <tbody>
${instr}
  </tbody>
</table>

<h3 style="${H3}">Course Description</h3>
${h.paras(R.description, 'Course description (catalog)', 'margin: 0 0 10px;')}${h.blank(R.source) ? '' : `\n<p style="margin: 0 0 8px; ${SUB} font-size: 0.85em;">Source: ${h.esc(R.source)}</p>`}

<h3 style="${H3}">Student Learning Outcomes</h3>
<p style="margin: 0 0 8px;">When you complete this course, you will be able to:</p>
<table style="width: 100%; border-collapse: collapse; margin: 0 0 8px;">
  <thead>
    <tr><th scope="col" style="${THC}">#</th><th scope="col" style="${THC}">Outcome</th><th scope="col" style="${THC}">How it is measured</th></tr>
  </thead>
  <tbody>
${outRows}
  </tbody>
</table>${objectives}${plo}

<h3 style="${H3}">Textbooks and Course Materials</h3>
<h4 style="margin: 0 0 6px; color: #1f2933;">Required</h4>
${texts}${listOf(v.otherMaterials, 'Other required materials')}${listOf(v.supplemental, 'Optional materials')}

<h3 style="${H3}">Course Approach</h3>
${h.paras(v.courseApproach, 'Course approach', 'margin: 0 0 10px;')}

<p style="margin: 22px 0 0; ${SUB} font-size: 0.85em; text-align: right;">${ver}Last updated: ${h.date(h.today(), 'full')}</p>
</div>`;
  }
});


/* Syllabus chapter 2: Assignments and Grading. Graded components, signature assignments
   from the catalog, the grading table (checked: weights total 100%, points and weights
   agree), the school grading scale and the course passing grade. BPPE §71710(a)(3)(F). */
GEN.registerComponent({
  id: 'syllabus-grading',
  order: 20,
  name: 'Syllabus 2: Assignments and Grading',
  version: '1.1',
  description: 'Second syllabus chapter: what is graded, how much each item counts, the grading scale and the passing grade. Checks that weights total 100% and match the points. Signature assignments come from the Course catalog tab.',
  placement: 'Syllabus Book, chapter 2 ("Assignments and Grading"). Set up the Moodle gradebook with the same items and points. Paste in the Source code view.',
  fields: [
    { key: 'items', label: 'Graded items', type: 'list', itemLabel: 'Graded item',
      help: 'One per gradebook item or category. Use the catalog names for signature assignments. Weights must total 100%.',
      fields: [
        { key: 'name', label: 'Name', type: 'text' },
        { key: 'description', label: 'Short description', type: 'textarea', help: 'One or two sentences. Full instructions and the rubric go in the Moodle assignment.' },
        { key: 'points', label: 'Points (optional)', type: 'number' },
        { key: 'weight', label: 'Percentage of final grade', type: 'number' }
      ] },
    { key: 'weighting', label: 'How percentages are set', type: 'select', options: ['Percentages follow the points', 'Weighted categories'], default: 'Percentages follow the points',
      help: 'Choose Weighted categories when a category\'s percentage is set separately from its points (for example, 100 quiz points worth 20%). Set the Moodle gradebook to match.' },
    { key: 'separateLab', label: 'The companion lab course has its own grade', type: 'checkbox', default: false,
      help: 'For lecture and lab pairs graded separately, such as RD 324 and RD 324L. The lab code comes from the catalog record.' },
    { key: 'labItems', label: 'Lab graded items', type: 'list', itemLabel: 'Lab item', showIf: 'separateLab',
      help: 'Weights must total 100% of the lab grade.',
      fields: [
        { key: 'name', label: 'Name', type: 'text' },
        { key: 'description', label: 'Short description', type: 'textarea' },
        { key: 'points', label: 'Points (optional)', type: 'number' },
        { key: 'weight', label: 'Percentage of lab grade', type: 'number' }
      ] },
    { key: 'supplementUrl', label: 'Syllabus supplement link (optional)', type: 'url', help: 'For details kept in a separate document, such as lab practical and competency sign-off requirements. Upload it to Moodle and link it here.' },
    { key: 'supplementTitle', label: 'Syllabus supplement title', type: 'text', default: 'Syllabus Supplement: Lab Practicals and Competency Sign-Offs', showIf: 'supplementUrl' },
    { key: 'participation', label: 'Participation and professionalism expectations (optional)', type: 'textarea' },
    { key: 'showAdjustment', label: 'Show the school grading adjustment statement', type: 'checkbox', default: true }
  ],
  sample: {
    items: [
      { name: 'Midterm clinical evaluation', description: 'Your clinical instructor rates your progress at the clinical site using the midterm evaluation rubric.', points: 25, weight: 25 },
      { name: 'Final clinical evaluation', description: 'End-of-quarter evaluation of your clinical performance and professionalism.', points: 35, weight: 35 },
      { name: 'Competency exams', description: 'Required competencies completed and passed in Trajecsys this quarter.', points: 30, weight: 30 },
      { name: 'Patient logs and clinical hours', description: 'Patient pathology logs and clinical hours kept up to date in Trajecsys.', points: 10, weight: 10 }
    ],
    participation: 'Arrive on time for every rotation, follow your site\'s dress code and policies, and communicate absences to your clinical site and coordinator before your shift starts.'
  },
  render(v, ctx, h) {
    const S = ctx.school || {};
    const R = h.record(ctx), P = h.program(ctx);
    const BLUE = '#006ba6', SUB = 'color: #4a5560;';
    const H3 = `color: ${BLUE}; border-bottom: 2px solid ${BLUE}; padding-bottom: 4px; margin: 28px 0 10px;`;
    const TH = 'text-align: left; padding: 8px 10px; border-bottom: 2px solid #006ba6; color: #4a5560; font-size: 0.85em;';
    const TD = 'padding: 8px 10px; border-bottom: 1px solid #e3e8ec; vertical-align: top;';
    const num = x => (x === '' || x == null || isNaN(Number(x))) ? null : Number(x);
    const r2 = x => Math.round(x * 100) / 100;
    const norm = s => String(s || '').trim().toLowerCase();

    const items = (v.items || []).filter(i => !h.blank(i.name) || num(i.weight) != null);
    const sig = (R.signatureAssignments || []).filter(s => !h.blank(s.name));
    const isSig = name => sig.some(s => norm(s.name) === norm(name));

    const weighted = v.weighting === 'Weighted categories';
    const labOn = !!v.separateLab;
    const lecCode = h.text(ctx.course.courseCode || R.courseCode, 'Course code');
    const labCode = labOn ? h.text(R.labCourseCode, 'Lab course code (catalog)') : '';
    if (labOn && !R.hasLabCourse) h.warn('The catalog record has no companion lab course; turn off "has its own grade" or add the lab to the catalog');
    const labItems = labOn ? (v.labItems || []).filter(i => !h.blank(i.name) || num(i.weight) != null) : [];

    /* checks (shown in the generator, never in the output) */
    const check = (list, label) => {
      const w = list.reduce((t, i) => t + (num(i.weight) || 0), 0);
      const pt = list.reduce((t, i) => t + (num(i.points) || 0), 0);
      if (list.length && Math.abs(w - 100) > 0.01) h.warn(`${label}weights total ${r2(w)}%, not 100%`);
      if (!weighted && pt > 0) list.forEach(i => {
        const p = num(i.points), wt = num(i.weight);
        if (p == null || wt == null) return;
        const share = p / pt * 100;
        if (Math.abs(share - wt) > 0.5) h.warn(`${label}${i.name || 'An item'}: ${p} points is ${r2(share)}% of the points but is weighted ${wt}% (choose Weighted categories, or match them)`);
      });
    };
    check(items, labOn ? 'Lecture grading: ' : 'Grading ');
    if (labOn) { if (!labItems.length) h.warn('Lab graded items'); check(labItems, 'Lab grading: '); }
    sig.forEach(s => { if (!items.concat(labItems).some(i => norm(i.name) === norm(s.name))) h.warn(`Signature assignment "${s.name}" is not in the graded items`); });

    const sigHtml = sig.length ? `
<h3 style="${H3}">Signature Assignments</h3>
<p style="margin: 0 0 8px;">These assignments are the same in every section of this course. The numbers in parentheses are the learning outcomes each one measures (see Course Overview).</p>
<ul style="margin: 0 0 10px; padding-left: 22px;">
${sig.map(s => `  <li style="margin: 0 0 4px;"><strong>${h.esc(s.name)}</strong>${h.blank(s.outcomes) ? '' : ` <span style="${SUB}">(outcomes ${h.esc(s.outcomes)})</span>`}</li>`).join('\n')}
</ul>` : '';

    const tag = '<span style="padding: 1px 7px; border-radius: 3px; background: #eef4f8; color: #4a5560; font-size: 0.75em; font-weight: bold;">Signature assignment</span>';
    const cards = (list, gradeNoun) => list.length
      ? list.map(i => `<div style="margin: 0 0 10px; padding: 10px 14px; border: 1px solid #c9d3dc; border-left: 4px solid ${BLUE}; border-radius: 6px;">
<p style="margin: 0 0 4px;"><strong>${h.text(i.name, 'Graded item name')}</strong>${num(i.weight) != null ? ` <span style="${SUB}">(${num(i.weight)}% of ${gradeNoun})</span>` : ''}${isSig(i.name) ? ' ' + tag : ''}</p>
${h.blank(i.description) ? '' : h.paras(i.description, '', 'margin: 0 0 4px;')}
</div>`).join('\n')
      : `<p>${h.text('', 'Graded items')}</p>`;
    const table = (list, caption) => {
      const hasPoints = list.some(i => num(i.points) != null);
      const wT = list.reduce((t, i) => t + (num(i.weight) || 0), 0), pT = list.reduce((t, i) => t + (num(i.points) || 0), 0);
      const rows = list.map(i => `    <tr><td style="${TD}">${h.text(i.name, 'Graded item name')}</td>${hasPoints ? `<td style="${TD} text-align: right;">${num(i.points) != null ? num(i.points) : ''}</td>` : ''}<td style="${TD} text-align: right;">${num(i.weight) != null ? num(i.weight) + '%' : h.text('', 'Percentage of grade')}</td></tr>`).join('\n');
      return `${caption ? `<h4 style="margin: 14px 0 6px; color: #1f2933;">${caption}</h4>\n` : ''}<table style="width: 100%; border-collapse: collapse; margin: 0 0 8px;">
  <thead>
    <tr><th scope="col" style="${TH}">Graded item</th>${hasPoints ? `<th scope="col" style="${TH} text-align: right; width: 14%;">Points</th>` : ''}<th scope="col" style="${TH} text-align: right; width: 22%;">Percentage of grade</th></tr>
  </thead>
  <tbody>
${rows}
    <tr><th scope="row" style="${TD} text-align: left; font-weight: bold;">Total</th>${hasPoints ? `<td style="${TD} text-align: right; font-weight: bold;">${r2(pT)}</td>` : ''}<td style="${TD} text-align: right; font-weight: bold;">${r2(wT)}%</td></tr>
  </tbody>
</table>`;
    };
    const compsHtml = labOn
      ? `<h4 style="margin: 0 0 8px; color: #1f2933;">${lecCode}</h4>\n${cards(items, lecCode + ' grade')}\n<h4 style="margin: 16px 0 8px; color: #1f2933;">${labCode}</h4>\n${cards(labItems, labCode + ' grade')}`
      : cards(items, 'final grade');
    const tablesHtml = labOn ? table(items, lecCode) + '\n' + table(labItems, labCode) : table(items, '');
    const weightNote = weighted ? `<p style="margin: 6px 0 0; ${SUB} font-size: 0.92em;">Each category counts for the percentage shown, whatever its total points.</p>` : '';
    const supplement = h.blank(v.supplementUrl) ? '' : `<p style="margin: 10px 0 0; padding: 10px 14px; background: #f5f8fa; border-radius: 6px; color: #4a5560; font-size: 0.92em;"><strong style="color: #1f2933;">Also see:</strong> <a href="${h.url(v.supplementUrl, 'Syllabus supplement')}" style="color: ${BLUE}; font-weight: bold;">${h.text(v.supplementTitle, 'Syllabus supplement title')}</a></p>`;

    /* scale and passing grade */
    const pass = num(R.passingThreshold) != null ? num(R.passingThreshold) : num(P.passingThreshold);
    if (pass == null) h.warn('Passing grade (catalog record or program default)');
    const scale = (S.gradingScale || []).filter(g => !h.blank(g.letter));
    const scaleRows = scale.map(g => {
      const lo = num(g.min), hi = num(g.max);
      const ok = pass == null ? '' : (lo != null && lo >= pass ? 'Passing' : 'Not passing');
      return `    <tr><td style="${TD} font-weight: bold;">${h.esc(g.letter)}</td><td style="${TD}">${lo != null ? lo : ''}–${hi != null ? hi : ''}%</td>${pass == null ? '' : `<td style="${TD}">${ok}</td>`}</tr>`;
    }).join('\n');

    return `<div style="max-width: 860px; line-height: 1.55; color: #1f2933;">
<div style="background: ${BLUE}; padding: 14px 20px; border-radius: 8px; margin: 12px 0 8px;">
  <h3 style="margin: 0; color: #ffffff; font-size: 1.3em;">Assignments and Grading</h3>
  <p style="margin: 2px 0 0; color: #ffffff; font-size: 0.95em;">${h.text(ctx.course.courseCode || R.courseCode, 'Course code')} &nbsp;|&nbsp; ${h.text(ctx.course.term, 'Term')}</p>
</div>
<p style="margin: 0 0 6px; ${SUB} font-size: 0.92em;">Full instructions, due dates and rubrics are in each assignment in Moodle.</p>
${sigHtml}
<h3 style="${H3}">Graded Course Components</h3>
${compsHtml}
${h.blank(v.participation) ? '' : `<h4 style="margin: 16px 0 6px; color: #1f2933;">Participation and Professionalism</h4>\n${h.paras(v.participation, '', 'margin: 0 0 10px;')}`}
<h3 style="${H3}">Grading Procedure</h3>
${tablesHtml}
${weightNote}${supplement}
${v.showAdjustment && !h.blank(S.gradingAdjustmentStatement) ? `<p style="margin: 6px 0 0; ${SUB} font-size: 0.92em;">${h.esc(S.gradingAdjustmentStatement)}</p>` : ''}

<h3 style="${H3}">Grading Scale</h3>
<p style="margin: 0 0 8px; padding: 10px 14px; border: 1px solid #c9d3dc; border-left: 4px solid ${BLUE}; border-radius: 6px;"><strong>Passing grade:</strong> you must earn a final grade of ${pass == null ? h.text('', 'Passing grade') : pass + '%'} or higher to pass ${labOn ? 'each course' : 'this course'}.</p>
<table style="width: 100%; border-collapse: collapse; margin: 0 0 8px;">
  <thead>
    <tr><th scope="col" style="${TH} width: 20%;">Letter grade</th><th scope="col" style="${TH}">Final grade</th>${pass == null ? '' : `<th scope="col" style="${TH}">Result</th>`}</tr>
  </thead>
  <tbody>
${scaleRows || `    <tr><td style="${TD}" colspan="3">${h.text('', 'Letter grade scale (School-wide settings)')}</td></tr>`}
  </tbody>
</table>
<p style="margin: 6px 0 0; ${SUB} font-size: 0.92em;">Incomplete grades, grade changes and appeals follow the KPSAHS grading policy in the Standardized KPSAHS Instructional Policies chapter.</p>
<p style="margin: 22px 0 0; ${SUB} font-size: 0.85em; text-align: right;">Last updated: ${h.date(h.today(), 'full')}</p>
</div>`;
  }
});


/* Course Calendar: lecture, lab, and Zoom, one expandable block per week.
   Dates are calculated from the course start date and meeting days; school holidays
   become "No class" automatically. Moodle-safe: no tables inside <details>, no flex. */
GEN.registerComponent({
  id: 'course-calendar',
  order: 30,
  name: 'Course Calendar',
  version: '1.2',
  description: 'Weekly lecture and lab calendar with Zoom details, auto-calculated dates, and expandable weeks.',
  placement: 'Moodle Book chapter, Page, or section summary. Paste in the editor Source code view.',
  fields: [
    { key: 'layout', label: 'Layout', type: 'select', options: ['Grid (3 weeks per row)', 'List (one week per row)'], default: 'Grid (3 weeks per row)',
      help: 'Grid looks like a calendar. List reads better on phones.' },
    { key: 'lectureDay', label: 'Lecture day', help: 'Leave blank to use the class days, time and room from Course details.', type: 'select', options: ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] },
    { key: 'lectureDay2', label: 'Second lecture day (optional)', type: 'select', options: ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] },
    { key: 'lectureTime', label: 'Lecture time', type: 'text', placeholder: 'e.g., 9:00 am–12:00 pm' },
    { key: 'lectureRoom', label: 'Lecture room', type: 'text' },
    { key: 'includeLab', label: 'This course has a lab', type: 'checkbox', default: true },
    { key: 'labDay', label: 'Lab day', type: 'select', options: ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], showIf: 'includeLab' },
    { key: 'labTime', label: 'Lab time', type: 'text', placeholder: 'e.g., 1:00–4:00 pm', showIf: 'includeLab' },
    { key: 'labRoom', label: 'Lab room', type: 'text', showIf: 'includeLab' },
    { key: 'includeZoom', label: 'Show Zoom meeting details', type: 'checkbox', default: true },
    { key: 'zoomUrl', label: 'Zoom meeting link', type: 'url', showIf: 'includeZoom', help: 'Keep the passcode out of the link.' },
    { key: 'zoomId', label: 'Zoom meeting ID', type: 'text', showIf: 'includeZoom' },
    { key: 'zoomPasscode', label: 'Zoom passcode', type: 'text', showIf: 'includeZoom' },
    { key: 'weeks', label: 'Weeks', type: 'list', itemLabel: 'Week',
      help: 'Dates fill in from the course start date and meeting days. Sessions on school holidays become "No class" automatically.',
      fields: [
        { key: 'lectureMode', label: 'Lecture', type: 'select', options: ['In person', 'Zoom', 'No class'], default: 'In person' },
        { key: 'lectureTopic', label: 'Lecture topic', type: 'text' },
        { key: 'labActivity', label: 'Lab activity', type: 'text' },
        { key: 'labCancelled', label: 'No lab this week', type: 'checkbox', default: false },
        { key: 'due', label: 'Due this week (one item per line)', type: 'textarea', placeholder: 'e.g., Quiz 1, due Fri' }
      ],
      default: Array.from({ length: 12 }, () => ({ lectureMode: 'In person', lectureTopic: '', labActivity: '', labCancelled: false, due: '' })) },
    { key: 'showNote', label: 'Show the "Dates can change" note', type: 'checkbox', default: true }
  ],
  sample: {
    lectureDay: 'Monday', lectureTime: '9:00 am–12:00 pm', lectureRoom: 'Room 210',
    labDay: 'Wednesday', labTime: '1:00–4:00 pm', labRoom: 'Scan Lab B',
    zoomUrl: 'https://kp.zoom.us/j/00000000000', zoomId: '000 0000 0000', zoomPasscode: 'sample',
    weeks: [
      { lectureTopic: 'Course orientation and scanning ergonomics', labActivity: 'Equipment orientation', due: 'Syllabus quiz, due Fri' },
      { lectureTopic: 'Sound wave properties', labActivity: 'Transducer handling' },
      { lectureTopic: 'Attenuation', labActivity: 'Image optimization practice', due: 'Homework 1, due Fri' },
      { lectureMode: 'Zoom', lectureTopic: 'Transducers', labActivity: 'Phantom scanning' }
    ]
  },
  render(v, ctx, h) {
    /* v1.1: blank meeting fields fall back to Course details, so days, times, room and
       Zoom are entered once for the calendar and the syllabus. */
    {
      const C0 = ctx.course || {}, fb = (x, y) => (h.blank(x) ? (y || '') : x);
      const t = (!h.blank(C0.meetingStart) || !h.blank(C0.meetingEnd)) ? GEN.makeHelpers().timeRange(C0.meetingStart, C0.meetingEnd) : '';
      v = Object.assign({}, v, {
        lectureDay: fb(v.lectureDay, C0.meetingDay1), lectureDay2: fb(v.lectureDay2, C0.meetingDay2),
        lectureTime: fb(v.lectureTime, t), lectureRoom: fb(v.lectureRoom, C0.room),
        zoomUrl: fb(v.zoomUrl, C0.zoomUrl), zoomId: fb(v.zoomId, C0.zoomId), zoomPasscode: fb(v.zoomPasscode, C0.zoomPasscode)
      });
      if (C0.hasLabMeeting) {
        const lt = (!h.blank(C0.labStart) || !h.blank(C0.labEnd)) ? GEN.makeHelpers().timeRange(C0.labStart, C0.labEnd) : '';
        v = Object.assign(v, { labDay: fb(v.labDay, C0.labDay), labTime: fb(v.labTime, lt || C0.labNote), labRoom: fb(v.labRoom, C0.labRoom) });
      }
    }
    const C = ctx.course || {}, S = ctx.school || {};
    const BLUE = '#006ba6', TEAL = '#0b7a82';
    const NOCLASS = 'padding: 1px 6px; border-radius: 3px; background: #fdecea; color: #8a1f11; font-size: 0.75em; font-weight: bold;';
    const PILL = 'padding: 1px 8px; border: 1px solid #006ba6; border-radius: 10px; color: #006ba6; font-size: 0.75em; font-weight: bold;';
    const BOX = 'margin: 0 0 8px; padding: 10px 14px; border: 1px solid #c9d3dc; border-radius: 6px;';
    const SUB = 'color: #4a5560; font-size: 0.92em;';
    const grid = String(v.layout).indexOf('Grid') === 0;
    const isize = grid ? 18 : 20, igap = grid ? 4 : 6;
    const ic = (n, alt) => h.icon(n, { size: isize, gap: igap, alt });
    const days = [v.lectureDay, v.lectureDay2].filter(d => !h.blank(d));

    /* ---- per-week data ---- */
    const weeks = (v.weeks || []).map((w, i) => {
      const wk = h.week(C.startDate, i);
      const lectures = (days.length ? days : ['']).map(d => {
        const date = h.onWeekday(wk.start, d);
        const hol = date ? h.holiday(date, ctx) : '';
        const mode = hol ? 'No class' : w.lectureMode;
        return { date, mode, topic: hol || w.lectureTopic };
      });
      const labDate = v.includeLab ? h.onWeekday(wk.start, v.labDay) : '';
      const labHol = labDate ? h.holiday(labDate, ctx) : '';
      return { n: i + 1, wk, lectures, labDate, labOff: !!(w.labCancelled || labHol), labText: labHol || w.labActivity,
        due: String(w.due || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean) };
    });

    const range = wk => h.date(wk.start, 'md') + ' &ndash; ' + h.date(wk.end, 'md');
    const lectureLine = (L, compact) => {
      const iconName = L.mode === 'Zoom' ? 'zoom' : 'class';
      const label = L.mode === 'Zoom' ? 'Lecture (Zoom)' : 'Lecture';
      const body = L.mode === 'No class' ? `<span style="${NOCLASS}">No class</span> ${h.text(L.topic, 'Holiday or reason')}` : h.text(L.topic, 'Lecture topic');
      const zoom = L.mode === 'Zoom' ? (compact ? '<br>' : ' &nbsp;') + `<a href="${h.url(v.zoomUrl, 'Zoom meeting')}" style="color: ${TEAL}; font-weight: bold;">Join Zoom</a>` : '';
      return compact
        ? `<p style="margin: 0 0 8px;">${ic(iconName)}<strong style="color: ${BLUE};">${label}</strong><br>${h.date(L.date, 'short')}: ${body}${zoom}</p>`
        : `<p style="margin: 0 0 8px;">${ic(iconName)}<strong style="color: ${BLUE};">${label}, ${h.date(L.date, 'short')}:</strong> ${body}${zoom}</p>`;
    };
    const labLine = (w, compact) => {
      if (!v.includeLab) return '';
      const body = w.labOff ? `<span style="${NOCLASS}">No class</span> ${h.opt(w.labText)}` : h.text(w.labText, 'Lab activity');
      const style = `margin: 0 0 8px; padding: ${compact ? '5px 8px' : '6px 10px'}; background: #f5f8fa; border-left: 3px solid #4a5560;`;
      return compact
        ? `<p style="${style}">${ic('lab')}<strong>Lab</strong><br>${h.date(w.labDate, 'short')}: ${body}</p>`
        : `<p style="${style}">${ic('lab')}<strong>Lab, ${h.date(w.labDate, 'short')}:</strong> ${body}</p>`;
    };
    const dueLine = (w, compact) => {
      const items = w.due.length ? w.due.map(h.esc).join('<br>') : '<span style="color: #4a5560;">Nothing due</span>';
      return compact
        ? `<p style="margin: 0 0 6px;">${ic('assignment')}<strong>Due</strong><br>${items}</p>`
        : `<p style="margin: 0 0 4px;">${ic('assignment')}<strong>Due:</strong> ${items}</p>`;
    };
    const strip = w => {
      const parts = [];
      w.lectures.forEach(L => parts.push(L.mode === 'No class' ? `<span style="${NOCLASS}">No class</span> ` : ic(L.mode === 'Zoom' ? 'zoom' : 'class')));
      if (v.includeLab) parts.push(w.labOff ? '' : ic('lab'));
      if (w.due.length) parts.push(ic('assignment'));
      return parts.join('');
    };

    /* ---- weeks: grid tiles or list blocks ---- */
    let weeksHtml;
    if (grid) {
      const tile = (w, last) => `<div style="float: left; width: 32%; margin: 0 ${last ? '0' : '2%'} 12px 0;">
<details style="border: 1px solid #c9d3dc; border-radius: 6px; background: #ffffff;">
<summary style="cursor: pointer; padding: 10px 12px; background: #eef4f8; border-radius: 6px; color: #1f2933;"><strong style="color: ${BLUE}; font-size: 1.1em;">Week ${w.n}</strong><br><span style="color: #4a5560; font-size: 0.85em;">${range(w.wk)}</span><br>${strip(w)}<br><span style="${PILL}">Click to expand</span></summary>
<div style="padding: 8px 12px 2px; font-size: 0.9em;">
${w.lectures.map(L => lectureLine(L, true)).join('\n')}
${labLine(w, true)}
${dueLine(w, true)}
</div>
</details>
</div>`;
      const rows = [];
      for (let i = 0; i < weeks.length; i += 3) {
        const chunk = weeks.slice(i, i + 3);
        rows.push(`<!-- Weeks ${chunk[0].n}–${chunk[chunk.length - 1].n} -->
<div style="margin: 0;">
${chunk.map((w, j) => tile(w, j === chunk.length - 1 && chunk.length === 3)).join('\n')}
<div style="clear: both;"></div>
</div>`);
      }
      weeksHtml = rows.join('\n');
    } else {
      weeksHtml = weeks.map(w => `<details style="border: 1px solid #c9d3dc; border-radius: 6px; margin: 0 0 8px; background: #ffffff;">
<summary style="cursor: pointer; padding: 10px 14px; background: #eef4f8; color: ${BLUE}; font-weight: bold; border-radius: 6px;">Week ${w.n} <span style="font-weight: normal; color: #4a5560;">&nbsp;|&nbsp; ${range(w.wk)}</span> &nbsp;<span style="${PILL}">Click to expand</span></summary>
<div style="padding: 10px 16px 6px;">
${w.lectures.map(L => lectureLine(L, false)).join('\n')}
${labLine(w, false)}
${dueLine(w, false)}
</div>
</details>`).join('\n');
    }

    /* ---- meeting boxes and key ---- */
    const dayList = days.length ? days.map(h.esc).join(' and ') : '[Day(s)]';
    const meet = [`<div style="${BOX} border-left: 4px solid ${BLUE};">
${h.icon('class', { alt: '' })}<strong style="color: ${BLUE};">Lecture:</strong> <span style="${SUB}">${dayList}, ${h.text(v.lectureTime, 'Lecture time')} &nbsp;|&nbsp; ${h.text(v.lectureRoom, 'Lecture room')}</span>
</div>`];
    if (v.includeLab) meet.push(`<div style="${BOX} border-left: 4px solid #4a5560; background: #f5f8fa;">
${h.icon('lab', { alt: '' })}<strong>Lab:</strong> <span style="${SUB}">${h.text(v.labDay, 'Lab day')}, ${h.text(v.labTime, 'Lab time')} &nbsp;|&nbsp; ${h.text(v.labRoom, 'Lab room')}</span>
</div>`);
    if (v.includeZoom) meet.push(`<div style="${BOX} border-left: 4px solid ${TEAL};">
${h.icon('zoom', { alt: '' })}<strong style="color: ${TEAL};">Zoom:</strong> <a href="${h.url(v.zoomUrl, 'Zoom meeting')}" style="color: ${TEAL}; font-weight: bold;">Join Zoom meeting</a> <span style="${SUB}">&nbsp;|&nbsp; Meeting ID: ${h.text(v.zoomId, 'Zoom meeting ID')} &nbsp;|&nbsp; Passcode: ${h.text(v.zoomPasscode, 'Zoom passcode')}</span>
</div>`);
    const keyItems = [['class', 'In-person class'], ['zoom', 'Zoom session']];
    if (v.includeLab) keyItems.push(['lab', 'Lab']);
    keyItems.push(['assignment', 'Assignment due']);
    const key = keyItems.map(([n, l]) => h.icon(n, { alt: '' }) + l).join(' &nbsp;&nbsp; ');

    const sub = (h.blank(C.courseCode) ? '' : h.esc(C.courseCode) + ' ') + (v.includeLab ? 'Lecture and Lab' : 'Lecture') + ' &nbsp;|&nbsp; ' + h.text(C.term, 'Term');
    const note = v.showNote ? `<p style="margin: 6px 0 6px; padding: 10px 14px; background: #f5f8fa; border-radius: 6px; color: #4a5560; font-size: 0.92em;"><strong style="color: #1f2933;">Note:</strong> Dates can change. Check announcements and the Moodle calendar for updates, and see the <a href="${h.url(S.academicCalendarUrl, 'Academic calendar')}" style="color: ${BLUE}; font-weight: bold;">KPSAHS academic calendar</a> for school-wide dates.</p>` : '';
    if (h.blank(C.startDate)) h.text('', 'Course start date (Course details)');

    return `<div style="max-width: 860px; line-height: 1.45; color: #1f2933;">
<div style="background: ${BLUE}; padding: 14px 20px; border-radius: 8px 8px 0 0; margin: 12px 0 0;">
<h3 style="margin: 0; color: #ffffff; font-size: 1.25em;">Course Calendar</h3>
<p style="margin: 2px 0 0; color: #ffffff; font-size: 0.9em;">${sub}</p>
</div>
<div style="border: 1px solid #c9d3dc; border-top: none; border-radius: 0 0 8px 8px; padding: 14px 20px 10px; margin: 0 0 20px;">
${meet.join('\n')}
<p style="margin: 4px 0 14px; padding: 8px 12px; background: #f5f8fa; border-radius: 6px; color: #4a5560; font-size: 0.88em;"><strong style="color: #1f2933;">Key:</strong> &nbsp;${key}</p>
<p style="margin: 0 0 10px; font-weight: bold;">Click a week to expand it and see the lecture, lab, and due dates. Click it again to close it.</p>
${weeksHtml}
${note}
<p style="margin: 12px 0 0; color: #4a5560; font-size: 0.85em; text-align: right;">Last updated: ${h.date(h.today(), 'full')}</p>
</div>
</div>`;
  }
});


/* Syllabus chapter 4: Course Policies and Resources. The instructor's own course policies
   (exam protocol, submissions, communication...), program statements from the program
   record, and where to get help. The standardized KPSAHS policies are chapter 5
   (syllabus-instructional-policies). v2.0: course policies became a titled list, and the
   attendance, late work, AI, device and recording notes moved to chapter 5. */
GEN.registerComponent({
  id: 'syllabus-policies',
  order: 40,
  name: 'Syllabus 4: Course Policies and Resources',
  version: '2.1',
  description: 'Fourth syllabus chapter: your course policies (exams, submissions, communication, behavior), program statements, and where students get help. KPSAHS-wide policies are chapter 5.',
  placement: 'Syllabus Book, chapter 4 ("Course Policies and Resources"). Chapter 3 is the Course Calendar. Paste in the Source code view.',
  fields: [
    { key: 'coursePolicies', label: 'Course policies', type: 'list', itemLabel: 'Policy', titleKey: 'title',
      help: 'Only filled-in policies appear. Keep each one to what is specific to this course; school-wide rules belong in chapter 5. Separate paragraphs with a blank line; start a line with "- " for a bullet.',
      fields: [
        { key: 'title', label: 'Policy title', type: 'text' },
        { key: 'text', label: 'Policy', type: 'textarea' }
      ],
      default: [
        { title: 'Behavioral expectations', text: '' },
        { title: 'Email and Moodle', text: '' },
        { title: 'Exam and quiz protocol', text: '' },
        { title: 'Assignment submission and technical problems', text: '' },
        { title: 'Grades and grade questions', text: '' }
      ] },
    { key: 'showHelp', label: 'Show the "Getting Help" section', type: 'checkbox', default: true }
  ],
  migrate(saved) {
    if (saved && !saved.coursePolicies && saved.classroomPolicies) {
      saved.coursePolicies = [{ title: 'Classroom policies', text: saved.classroomPolicies }];
    }
    return saved;
  },
  sample: {
    coursePolicies: [
      { title: 'Behavioral expectations', text: 'Treat classmates and instructors with respect in class, on campus, at clinical sites and online. Follow the Student Code of Conduct in the Academic Catalog.' },
      { title: 'Email and Moodle', text: 'Check your KPSAHS email daily. Email your instructor only from your KPSAHS account.' },
      { title: 'Exam and quiz protocol', text: 'During tests you may have only two pens, two pencils and two erasers.\n- No phones, smart watches or other devices.\n- Online tests must be submitted before time runs out.\n- Copying, photographing or recording any part of an exam is prohibited.' },
      { title: 'Assignment submission and technical problems', text: '' },
      { title: 'Grades and grade questions', text: 'Grades are usually posted before the next class. Raise scoring questions with the instructor within one week of the exam or review session. Final course grades are not rounded.' }
    ]
  },
  render(v, ctx, h) {
    const C = ctx.course || {}, S = ctx.school || {};
    const R = h.record(ctx), P = h.program(ctx);
    const BLUE = '#006ba6', SUB = 'color: #4a5560;';
    const H3 = `color: ${BLUE}; border-bottom: 2px solid ${BLUE}; padding-bottom: 4px; margin: 28px 0 10px;`;
    const A = (href, label, text) => `<a href="${h.url(href, label)}" style="color: ${BLUE}; font-weight: bold;">${text}</a>`;
    const rich = txt => String(txt || '').trim().split(/\n\s*\n/).map(block => {
      const out = []; let list = [];
      const flush = () => { if (list.length) { out.push(`<ul style="margin: 0 0 8px; padding-left: 22px;">\n${list.map(x => `  <li style="margin: 0 0 3px;">${h.esc(x)}</li>`).join('\n')}\n</ul>`); list = []; } };
      block.split(/\r?\n/).forEach(l => { const m = /^\s*[-•]\s+(.*)$/.exec(l); if (m) list.push(m[1]); else { flush(); if (l.trim()) out.push(`<p style="margin: 0 0 8px;">${h.esc(l.trim())}</p>`); } });
      flush(); return out.join('\n');
    }).join('\n');

    const pols = (v.coursePolicies || []).filter(p => !h.blank(p.text));
    const course = pols.map(p => `<h4 style="margin: 16px 0 6px; color: #1f2933;">${h.text(p.title, 'Policy title')}</h4>\n${rich(p.text)}`).join('\n');
    const prog = [['Diversity and Inclusion', P.diversityStatement], ['Pronouns', P.pronounsStatement]]
      .filter(x => !h.blank(x[1])).map(x => `<h4 style="margin: 16px 0 6px; color: #1f2933;">${x[0]}</h4>\n${rich(x[1])}`).join('\n');

    const help = [
      `<li style="margin: 0 0 4px;"><strong>Your instructor:</strong> ${h.text(C.instructorName, 'Primary instructor name')}, ${h.blank(C.instructorEmail) ? h.text('', 'Primary instructor email') : A(h.mailto(C.instructorEmail), 'Instructor email', h.esc(C.instructorEmail))}. Office hours: ${h.text(C.officeHours, 'Office hours')}.</li>`,
      h.blank(S.lmsHelpEmail) ? '' : `<li style="margin: 0 0 4px;"><strong>Moodle or email login problems:</strong> ${A(h.mailto(S.lmsHelpEmail), 'Online learning help email', h.esc(S.lmsHelpEmail))}</li>`,
      h.blank(S.tutoringUrl) ? '' : `<li style="margin: 0 0 4px;"><strong>Math and writing tutoring:</strong> ${A(S.tutoringUrl, 'Tutoring', 'NetTutor online tutoring')}</li>`,
      `<li style="margin: 0 0 4px;"><strong>Other support:</strong> ${A(S.studentSupportUrl, 'Student support', 'Student support resources')} (IT help, wellness, and who to contact)</li>`,
      h.blank(S.libraryUrl) ? '' : `<li style="margin: 0 0 4px;"><strong>Library:</strong> ${A(S.libraryUrl, 'Library', 'KPSAHS library resources')}</li>`,
      h.blank(S.studentPortalUrl) ? '' : `<li style="margin: 0 0 4px;"><strong>Final grades and unofficial transcripts:</strong> ${A(S.studentPortalUrl, 'Student portal', 'Student portal')}</li>`,
      h.blank(S.studentHandbookUrl) ? '' : `<li style="margin: 0 0 4px;"><strong>Student Handbook:</strong> ${A(S.studentHandbookUrl, 'Student handbook', 'KPSAHS Student Handbook')}</li>`,
      `<li style="margin: 0 0 4px;"><strong>Dates and deadlines:</strong> ${A(S.academicCalendarUrl, 'Academic calendar', 'KPSAHS academic calendar')}</li>`
    ].filter(Boolean).join('\n');

    if (!pols.length && !prog) h.warn('Course policies (none filled in yet)');

    return `<div style="max-width: 860px; line-height: 1.55; color: #1f2933;">
<div style="background: ${BLUE}; padding: 14px 20px; border-radius: 8px; margin: 12px 0 8px;">
  <h3 style="margin: 0; color: #ffffff; font-size: 1.3em;">Course Policies and Resources</h3>
  <p style="margin: 2px 0 0; color: #ffffff; font-size: 0.95em;">${h.text(C.courseCode || R.courseCode, 'Course code')} &nbsp;|&nbsp; ${h.text(C.term, 'Term')}</p>
</div>
<p style="margin: 0 0 6px; ${SUB} font-size: 0.92em;">Policies set by your instructor for this course. KPSAHS-wide policies are in the Standardized KPSAHS Instructional Policies chapter.</p>
${course ? `<h3 style="${H3}">Course Policies</h3>\n${course}\n` : ''}${prog ? `<h3 style="${H3}">Program Statements</h3>\n${prog}\n` : ''}${v.showHelp ? `<h3 style="${H3}">Getting Help</h3>\n<ul style="margin: 0 0 10px; padding-left: 22px;">\n${help}\n</ul>\n` : ''}<p style="margin: 22px 0 0; ${SUB} font-size: 0.85em; text-align: right;">Last updated: ${h.date(h.today(), 'full')}</p>
</div>`;
  }
});


/* Syllabus chapter 5: Standardized KPSAHS Instructional Policies. The policies every
   KPSAHS syllabus carries, kept once in School-wide settings (instructionalPolicies) so
   every course shows the same current wording. Each policy is a short summary plus a link
   to the full policy; the catalog stays the official version. Instructors add only the
   course-specific notes some policies allow (attendance, late work, AI, devices, recording). */
GEN.registerComponent({
  id: 'syllabus-instructional-policies',
  order: 45,
  name: 'Syllabus 5: Standardized KPSAHS Instructional Policies',
  version: '1.1',
  description: 'Fifth syllabus chapter: the standardized KPSAHS policies (attendance, late work, grading, AI, accommodations and the rest), maintained once in School-wide settings. Add only your course-specific notes here.',
  placement: 'Syllabus Book, chapter 5 ("Standardized KPSAHS Instructional Policies"). Paste in the Source code view.',
  fields: [
    { key: 'attendanceDetails', label: 'Attendance and make-up work in this course (optional)', type: 'textarea',
      help: 'Course-specific details only, such as online attendance checks or how to make up a missed quiz. Must not change the school policy.' },
    { key: 'lateWork', label: 'Late work in this course', type: 'textarea',
      help: 'Due times and whether late work is accepted. Required while the school has no late work policy.' },
    { key: 'courseAIStatement', label: 'AI use in this course (required)', type: 'textarea',
      help: 'The catalog requires faculty to define the ethical use of AI for their assignments in the syllabus or assignment instructions. Say what is allowed, what is not, and whether students must disclose AI use.' },
    { key: 'deviceRules', label: 'Devices in this course (optional)', type: 'textarea', placeholder: 'e.g., No cell phones during class. Laptops for note-taking only.' },
    { key: 'recordingRules', label: 'Recording in this course (optional)', type: 'textarea', placeholder: 'e.g., Students may not record lab instruction.' }
  ],
  sample: {
    attendanceDetails: 'During online sessions, attendance is checked through posts in the course chat. A missed check counts as five missed minutes.',
    lateWork: 'Didactic assignments are due by 11:55 pm on the Saturday before class unless noted. Late work receives a zero unless you ask the instructor before the due date and the instructor approves.',
    courseAIStatement: 'You may use AI tools to create study questions and review positioning terminology. Do not use AI to complete image critiques.',
    deviceRules: 'No cell phones during class. Tablets and laptops only when the instructor allows them.',
    recordingRules: ''
  },
  render(v, ctx, h) {
    const C = ctx.course || {}, S = ctx.school || {};
    const R = h.record(ctx), P = h.program(ctx);
    const BLUE = '#006ba6', SUB = 'color: #4a5560;';
    const H3 = `color: ${BLUE}; border-bottom: 2px solid ${BLUE}; padding-bottom: 4px; margin: 28px 0 10px;`;
    const A = (href, label, text) => `<a href="${h.url(href, label)}" style="color: ${BLUE}; font-weight: bold;">${text}</a>`;
    const type = R.courseType || '', mod = C.modality || '';

    const isClinical = /clinical/i.test(type);
    const isOnline = /^online/i.test(mod), isHybrid = /^hybrid/i.test(mod), isInPerson = !mod || /^in person/i.test(mod);
    const isSync = /\(synchronous|synchronous and/i.test(mod) || /^online$/i.test(mod);
    if (C._modalityFromCatalog && /^(online|hybrid)$/i.test(mod)) h.warn('Modality: the catalog only says "' + mod + '"; choose the exact modality in Course details so the right attendance policy shows');
    if (!mod) h.warn('Modality (Course details), which decides the attendance policy');
    const progName = String(C.program || R.program || '').toLowerCase();
    const applies = p => {
      if (!h.blank(p.program) && progName.indexOf(String(p.program).trim().toLowerCase()) < 0) return false;
      switch (p.appliesTo) {
        case 'In-person and online synchronous classes': return !isClinical && (isInPerson || (isOnline && isSync));
        case 'Hybrid classes': return !isClinical && isHybrid;
        case 'Online classes': return !isClinical && isOnline;
        case 'In-person and hybrid courses': return isInPerson || isHybrid;
        case 'Online and hybrid courses': return isOnline || isHybrid;
        case 'Lecture and lab courses': return !type || !isClinical;
        case 'Lab courses': return /lab/i.test(type) || !!R.hasLabCourse;
        case 'Clinical courses': return isClinical;
        default: return true;
      }
    };
    /* Summary text: blank lines split paragraphs; lines starting "- " become bullets. */
    const rich = txt => String(txt || '').trim().split(/\n\s*\n/).map(block => {
      const lines = block.split(/\r?\n/);
      const out = []; let list = [];
      const flush = () => { if (list.length) { out.push(`<ul style="margin: 0 0 8px; padding-left: 22px;">\n${list.map(x => `  <li style="margin: 0 0 3px;">${h.esc(x)}</li>`).join('\n')}\n</ul>`); list = []; } };
      lines.forEach(l => {
        const m = /^\s*[-•]\s+(.*)$/.exec(l), sh = /^\s*#{2,}\s+(.*)$/.exec(l);
        if (m) list.push(m[1]);
        else if (sh) { flush(); out.push(`<p style="margin: 10px 0 4px;"><strong>${h.esc(sh[1])}</strong></p>`); }
        else { flush(); if (l.trim()) out.push(`<p style="margin: 0 0 8px;">${h.esc(l.trim())}</p>`); }
      });
      flush(); return out.join('\n');
    }).join('\n');
    const sub = (head, text) => h.blank(text) ? '' : `<p style="margin: 8px 0 4px;"><strong>${head}</strong></p>\n${rich(text)}`;

    const n = x => (x === '' || x == null || isNaN(Number(x))) ? 0 : Number(x);
    const r2 = x => Math.round(x * 100) / 100;
    const creditLine = () => {
      const lecHrs = n(R.hoursOnsite) + n(R.hoursSync) + n(R.hoursAsync);
      if (h.blank(R.quarterCredits) || !lecHrs) return '';
      if (R.hasLabCourse && !h.blank(R.labCourseCode)) {
        return `<p style="margin: 8px 0 0;"><strong>This course:</strong> ${h.esc(R.courseCode)} carries ${h.esc(R.quarterCredits)} quarter credits (${r2(lecHrs)} scheduled hours) and ${h.esc(R.labCourseCode)} carries ${h.text(R.labQuarterCredits, 'Lab quarter credits (catalog)')} quarter credits (${h.text(R.labHours, 'Lab hours (catalog)')} scheduled hours).</p>`;
      }
      return `<p style="margin: 8px 0 0;"><strong>This course:</strong> ${h.esc(R.quarterCredits)} quarter credits and ${r2(lecHrs)} scheduled hours.</p>`;
    };

    const policies = (S.instructionalPolicies || []).filter(p => !h.blank(p.title) && applies(p));
    const T = ctx.term;
    const termDates = () => {
      if (!T) return `<p style="margin: 8px 0 0;">Dates for this quarter: see the ${A(S.academicCalendarUrl, 'Academic calendar', 'KPSAHS academic calendar')}.</p>`;
      const li = (k, d) => h.blank(d) ? '' : `  <li style="margin: 0 0 3px;">${k}: <strong>${h.date(d, 'long')}</strong></li>`;
      return `<p style="margin: 8px 0 4px;"><strong>${h.esc(T.term)} dates</strong></p>\n<ul style="margin: 0 0 8px; padding-left: 22px;">\n${[li('Last day to add or drop', T.addDropDeadline), li('Last day to drop with a W', T.withdrawDeadline), li('Last day of instruction', T.lastDay)].filter(Boolean).join('\n')}\n</ul>`;
    };
    if (!policies.length) h.warn('Standardized policies (School-wide settings)');

    const boxes = policies.map(p => {
      let add = '';
      switch (p.addOn) {
        case 'Course attendance details': add = sub('In this course', v.attendanceDetails); break;
        case 'Course late work rule':
          if (h.blank(v.lateWork) && h.blank(p.summary) && h.blank(p.url)) { h.warn('Late work in this course (no school late work policy is set)'); add = `<p style="margin: 0;">${h.text('', 'Late work in this course')}</p>`; }
          else add = h.blank(p.summary) ? rich(v.lateWork) : sub('In this course', v.lateWork);
          break;
        case 'Program and course AI guidance':
          if (h.blank(v.courseAIStatement)) h.warn('AI use in this course (the catalog requires faculty to define it)');
          add = sub('Program guidance', P.aiAddendum) + (h.blank(v.courseAIStatement) ? `<p style="margin: 8px 0 4px;"><strong>In this course</strong></p>\n<p style="margin: 0;">${h.text('', 'AI use in this course')}</p>` : sub('In this course', v.courseAIStatement));
          break;
        case 'Course device rules': add = sub('In this course', v.deviceRules); break;
        case 'Course recording rules': add = sub('In this course', v.recordingRules); break;
        case 'This course\'s credits and hours': add = creditLine(); break;
        case 'Academic calendar link':
        case 'Academic calendar dates for this term': add = termDates(); break;
      }
      const contact = h.blank(p.contactEmail) ? '' : `<p style="margin: 8px 0 0;">Contact: ${A(h.mailto(p.contactEmail), 'Policy contact email', h.esc(p.contactEmail))}</p>`;
      const where = h.blank(p.source) ? '' : `Source: ${h.esc(p.source)}. `;
      const link = h.blank(p.summary) ? '' : (h.blank(p.url)
        ? `<p style="margin: 8px 0 0; ${SUB} font-size: 0.85em;">${where}${A(S.catalogUrl, 'Academic catalog', 'KPSAHS Academic Catalog')}</p>`
        : `<p style="margin: 8px 0 0; ${SUB} font-size: 0.85em;">${where}${A(p.url, p.title + ' policy', 'Full ' + h.esc(p.title) + ' policy')}</p>`);
      return `<div style="margin: 0 0 10px; padding: 10px 14px; border: 1px solid #c9d3dc; border-left: 4px solid ${BLUE}; border-radius: 6px;">
<h4 style="margin: 0 0 6px; color: #1f2933; font-size: 1em;">${h.esc(p.title)}</h4>
${h.blank(p.summary) ? '' : rich(p.summary)}${add}${contact}${link}
</div>`;
    }).join('\n');

    const others = String(S.otherPolicies || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    const otherHtml = others.length ? `
<h3 style="${H3}">Other Relevant Academic Policies</h3>
<p style="margin: 0 0 6px;">These policies also apply. They are in the ${A(S.catalogUrl, 'Academic catalog', 'KPSAHS Academic Catalog')}${h.blank(S.studentHandbookUrl) ? '' : ' and the ' + A(S.studentHandbookUrl, 'Student handbook', 'Student Handbook')}:</p>
<ul style="margin: 0 0 10px; padding-left: 22px;">
${others.map(x => `  <li style="margin: 0 0 3px;">${h.esc(x)}</li>`).join('\n')}
</ul>` : '';

    return `<div style="max-width: 860px; line-height: 1.55; color: #1f2933;">
<div style="background: ${BLUE}; padding: 14px 20px; border-radius: 8px; margin: 12px 0 8px;">
  <h3 style="margin: 0; color: #ffffff; font-size: 1.3em;">Standardized KPSAHS Instructional Policies</h3>
  <p style="margin: 2px 0 0; color: #ffffff; font-size: 0.95em;">${h.text(C.courseCode || R.courseCode, 'Course code')} &nbsp;|&nbsp; ${h.text(C.term, 'Term')}</p>
</div>
<p style="margin: 0 0 12px;">These policies come from the ${h.blank(S.catalogVersion) ? 'KPSAHS Academic Catalog' : h.esc(S.catalogVersion)} and apply to this course. The ${A(S.catalogUrl, 'Academic catalog', 'KPSAHS Academic Catalog')} and its addenda are the official versions. Notes marked "In this course" are your instructor's additions.</p>
${boxes}
${otherHtml}
<p style="margin: 22px 0 0; ${SUB} font-size: 0.85em; text-align: right;">Last updated: ${h.date(h.today(), 'full')}</p>
</div>`;
  }
});

/* Important Dates: KP Blue header card with a Date | What happens | Type table.

GEN.registerComponent({
  id: 'important-dates',
  order: 60,
  name: 'Important Dates',
  version: '1.1',
  description: 'Dates that are not Moodle activities: first day, exams, withdrawal deadline, holidays, grades posted.',

  fields: [
    { key: 'heading', label: 'Heading', type: 'text', default: 'Important Dates' },
    { key: 'subtitle', label: 'Subtitle', type: 'text', help: 'Leave blank to use the course term.' },
    { key: 'includeHolidays', label: 'Add school holidays that fall in this term', type: 'checkbox', default: true },
    { key: 'includeTermDates', label: 'Add this term\'s academic calendar dates', type: 'checkbox', default: true,
      help: 'First day, add/drop and withdrawal deadlines, last day of instruction and final exams, from the academic calendar on the School-wide settings tab. Matched by the Term in Course details.' },
    { key: 'dates', label: 'Dates', type: 'list', itemLabel: 'Date',
      help: 'Rows are sorted by date automatically.',
      fields: [
        { key: 'date', label: 'Date', type: 'date' },
        { key: 'time', label: 'Time (optional)', type: 'text', placeholder: 'e.g., 11:59 pm' },

        { key: 'type', label: 'Type', type: 'select', options: ['Class', 'Exam', 'Deadline', 'No class', 'Campus'], default: 'Class' }
      ],
      default: [
        { date: '', time: '', event: 'First day of class', type: 'Class' },
        { date: '', time: '', event: 'Midterm exam', type: 'Exam' },
        { date: '', time: '', event: 'Last day to withdraw', type: 'Campus' },
        { date: '', time: '', event: 'Final exam', type: 'Exam' },
        { date: '', time: '', event: 'Final grades posted', type: 'Campus' }
      ] },
    { key: 'showNote', label: 'Show the "Dates can change" note', type: 'checkbox', default: true }
  ],
  sample: {
    dates: [
      { date: '2026-10-05', time: '', event: 'First day of class', type: 'Class' },
      { date: '2026-11-06', time: '9:00 am', event: 'Midterm exam', type: 'Exam' },
      { date: '2026-11-13', time: '', event: 'Last day to withdraw', type: 'Campus' },
      { date: '2026-12-18', time: '9:00 am', event: 'Final exam', type: 'Exam' },
      { date: '2026-12-23', time: '', event: 'Final grades posted', type: 'Campus' }
    ]
  },
  render(v, ctx, h) {
    const C = ctx.course || {};
    const rows = (v.dates || []).filter(r => !h.blank(r.event) || !h.blank(r.date)).map(r => Object.assign({}, r));
    if (v.includeHolidays) {
      (ctx.school.holidays || []).forEach(x => {
        if (!x || !x.date) return;
        if (C.startDate && x.date < C.startDate) return;
        if (C.endDate && x.date > C.endDate) return;
        rows.push({ date: x.date, time: '', event: (x.name || 'Holiday') + ': no class', type: 'No class' });
      });
    }
    if (v.includeTermDates && ctx.term) {
      const T = ctx.term, has = ev => rows.some(r => String(r.event || '').toLowerCase() === ev.toLowerCase());
      [['firstDay', 'First day of instruction', 'Class'], ['addDropDeadline', 'Last day to add or drop', 'Deadline'], ['withdrawDeadline', 'Last day to drop with a W', 'Deadline'],
       ['lastDay', 'Last day of instruction', 'Class'], ['finalsStart', 'Final exams begin', 'Exam']].forEach(([k, ev, ty]) => {
        if (T[k] && !has(ev)) rows.push({ date: T[k], time: '', event: ev, type: ty });
      });
    }
    rows.sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0);

    const TD = 'padding: 10px; border-bottom: 1px solid #e3e8ec;';
    const TH = 'text-align: left; padding: 8px 10px; border-bottom: 2px solid #006ba6; color: #4a5560; font-size: 0.85em;';
    const tag = t => t === 'No class'
      ? '<span style="padding: 1px 7px; border-radius: 3px; background: #fdecea; color: #8a1f11; font-size: 0.75em; font-weight: bold;">No class</span>'
      : '<span style="padding: 1px 7px; border-radius: 3px; background: #eef4f8; color: #4a5560; font-size: 0.75em; font-weight: bold;">' + h.esc(t || 'Class') + '</span>';
    const body = rows.map(r => `        <tr>
          <td style="${TD} font-weight: bold; color: #006ba6; white-space: nowrap;">${h.date(r.date, 'short')}${h.blank(r.time) ? '' : ', ' + h.esc(r.time)}</td>
          <td style="${TD}">${h.text(r.event, 'Event')}</td>
          <td style="${TD}">${tag(r.type)}</td>
        </tr>`).join('\n');

    const subtitle = h.blank(v.subtitle) ? h.text(C.term, 'Term') : h.esc(v.subtitle);
    const note = v.showNote ? `
    <p style="margin: 6px 0 6px; padding: 10px 14px; background: #f5f8fa; border-radius: 6px; color: #4a5560; font-size: 0.92em;"><strong style="color: #1f2933;">Note:</strong> Dates can change. Check announcements and the course calendar for updates, and see the <a href="${h.url(ctx.school.academicCalendarUrl, 'Academic calendar')}" style="color: #006ba6; font-weight: bold;">KPSAHS academic calendar</a> for school-wide dates.</p>` : '';

    return `<div style="max-width: 860px; border: 1px solid #c9d3dc; border-radius: 8px; margin: 12px 0 20px; background: #ffffff; line-height: 1.5; color: #1f2933;">
  <div style="background: #006ba6; padding: 14px 20px; border-radius: 8px 8px 0 0;">
    <h3 style="margin: 0; color: #ffffff; font-size: 1.25em;">${h.text(v.heading, 'Heading')}</h3>
    <p style="margin: 2px 0 0; color: #ffffff; font-size: 0.9em;">${subtitle}</p>
  </div>
  <div style="padding: 16px 20px 10px;">
    <table style="width: 100%; border-collapse: collapse; margin: 0 0 12px;">
      <thead>
        <tr>
          <th scope="col" style="${TH} width: 26%;">Date</th>
          <th scope="col" style="${TH}">What happens</th>
          <th scope="col" style="${TH} width: 16%;">Type</th>
        </tr>
      </thead>
      <tbody>
${body}
      </tbody>
    </table>${note}
    <p style="margin: 12px 0 0; color: #4a5560; font-size: 0.85em; text-align: right;">Last updated: ${h.date(h.today(), 'full')}</p>
  </div>
</div>`;
  }
});

<div style="border: 1px solid #c9d3dc; border-top: none; border-radius: 0 0 8px 8px; padding: 14px 20px 10px; margin: 0 0 20px;">
