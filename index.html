<table style="width: 100%; border-collapse: collapse; margin: 0 0 10px;">
  <thead>
    <tr><th scope="col" style="${TH}">#</th><th scope="col" style="${TH}">Online instructional activity</th><th scope="col" style="${TH} text-align: right;">Hours per quarter</th><th scope="col" style="${TH}">Specific assignments</th></tr>
  </thead>
  <tbody>
${body}
    <tr><th scope="row" style="${TD} text-align: left;" colspan="2">Total</th><td style="${TD} text-align: right; font-weight: bold;">${r2(total)}</td><td style="${TD} ${SUB}">${num(R.hoursSync) != null || num(R.hoursAsync) != null ? 'Catalog online hours: ' + r2(online) : ''}</td></tr>
  </tbody>
</table>
<p style="margin: 0; padding: 10px 14px; background: #f5f8fa; border-radius: 6px; color: #4a5560; font-size: 0.92em;"><strong style="color: #1f2933;">Note:</strong> Hours are estimates for the typical student and may be reallocated during the quarter to match syllabus changes.</p>
<p style="margin: 12px 0 0; ${SUB} font-size: 0.85em; text-align: right;">Last updated: ${h.date(h.today(), 'full')}</p>
</div>
</div>`;
  }
});

</script>
<script>
(function () {
  const KEY_SCHOOL = 'kpsahs-gen:school', KEY_PROFILE = 'kpsahs-gen:profile', KEY_VIEW = 'kpsahs-gen:view';
  const store = {
    get(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { } }
  };

  /* ---------- state ---------- */
  const builtSchool = GEN.merge(GEN.SCHOOL_FIELDS, GEN.SCHOOL_DEFAULTS);
  let school = store.get(KEY_SCHOOL) ? GEN.merge(GEN.SCHOOL_FIELDS, store.get(KEY_SCHOOL)) : JSON.parse(JSON.stringify(builtSchool));
  let profile = loadProfile(store.get(KEY_PROFILE));
  let view = 'course';  /* always open on Course details; the last tab used is not restored */
  let outTab = 'preview';

  function loadProfile(p) {
    const out = { course: GEN.merge(GEN.COURSE_FIELDS, p && p.course), comps: {} };
    GEN.components.forEach(c => { out.comps[c.id] = GEN.merge(c.fields, p && p.comps && p.comps[c.id], c.migrate); });
    return out;
  }
  const ctx = () => ({ school, course: profile.course });
  const SETUP = {
    course: { title: 'Course details', desc: 'Facts about this course section for this term. Every component uses them, so enter them once here. Save a course profile to reuse it next term.' },
    school: { title: 'School-wide settings', desc: 'Links, policy call-outs, the grading scale and holidays every course shares. These are not saved in course profiles, so a change here reaches every course the next time its blocks are generated. Built-in values come from the skill and update when the generator is rebuilt.' },
    programs: { title: 'Programs', desc: 'Standardized content that belongs to a program: statements, AI guidance, clinical coordinators and competency requirements. Part of the school-wide settings, so it is shared by every course in the program.' },
    catalog: { title: 'Course catalog', desc: 'Standardized syllabus content for each course: description, learning outcomes and how they are measured, credits, hours and signature assignments. Faculty do not change these per section. Part of the school-wide settings.' }
  };
  const save = () => { store.set(KEY_SCHOOL, school); store.set(KEY_PROFILE, profile); store.set(KEY_VIEW, view); };

  /* ---------- nav ---------- */
  function renderNav() {
    const nav = document.getElementById('nav');
    const link = (id, label, extra) => `<a href="#" data-view="${id}"${view === id ? ' aria-current="page"' : ''}>${GEN.makeHelpers().esc(label)}${extra || ''}</a>`;
    nav.innerHTML = '<h2>Setup</h2>' + link('course', 'Course details') + link('school', 'School-wide settings') +
      link('programs', 'Programs') + link('catalog', 'Course catalog') +
      '<h2>Components</h2>' + GEN.components.map(c => {
        const n = GEN.render(c, profile.comps[c.id], ctx()).missing.length;
        return link(c.id, c.name, n ? `<span class="count" title="${n} items to fill in or fix">${n} to do</span>` : '<span class="count">ready</span>');
      }).join('');
    nav.querySelectorAll('a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); view = a.dataset.view; save(); renderAll(); }));
  }

  /* ---------- form rendering ---------- */
  let uid = 0;
  function fieldHtmlId() { return 'f' + (++uid); }
  function renderFields(container, fields, obj, onStructure) {
    fields.forEach(f => {
      if (f.showIf) { const neg = f.showIf[0] === '!', k = f.showIf.replace(/^!/, ''); if (neg ? obj[k] : !obj[k]) return; }
      if (f.type === 'heading') {
        const hd = document.createElement('div'); hd.className = 'group-head';
        hd.innerHTML = `<h3>${GEN.makeHelpers().esc(f.label)}</h3>${f.help ? `<p class="help">${GEN.makeHelpers().esc(f.help)}</p>` : ''}`;
        container.appendChild(hd); return;
      }
      const wrap = document.createElement('div');
      wrap.className = 'field' + (f.type === 'checkbox' ? ' check' : '');
      const id = fieldHtmlId();
      const help = f.help ? `<p class="help" id="${id}-h">${GEN.makeHelpers().esc(f.help)}</p>` : '';
      const describedBy = f.help ? ` aria-describedby="${id}-h"` : '';
      if (f.type === 'list') {
        wrap.innerHTML = `<label>${GEN.makeHelpers().esc(f.label)}</label>${help}`;
        const list = document.createElement('div'); list.className = 'list';
        const items = obj[f.key] = obj[f.key] || [];
        items.forEach((item, i) => {
          const d = document.createElement('details'); d.className = 'item';
          const tf = f.titleKey ? (item[f.titleKey] ? { key: f.titleKey } : null) : f.fields.find(x => ['text', 'textarea', 'email'].includes(x.type) && item[x.key]);
          const title = (f.itemLabel || 'Item') + ' ' + (i + 1) + (tf ? ': ' + String(item[tf.key]).split('\n')[0].slice(0, 40) : '');
          d.innerHTML = `<summary><span>${GEN.makeHelpers().esc(title)}</span><span class="tools">
            <button type="button" data-a="up" aria-label="Move ${f.itemLabel || 'item'} ${i + 1} up">↑</button>
            <button type="button" data-a="down" aria-label="Move ${f.itemLabel || 'item'} ${i + 1} down">↓</button>
            <button type="button" data-a="dup" aria-label="Duplicate ${f.itemLabel || 'item'} ${i + 1}">Copy</button>
            <button type="button" data-a="del" aria-label="Remove ${f.itemLabel || 'item'} ${i + 1}">✕</button></span></summary>`;
          const inner = document.createElement('div'); inner.className = 'inner';
          renderFields(inner, f.fields, item, onStructure);
          d.appendChild(inner);
          d.querySelectorAll('.tools button').forEach(b => b.addEventListener('click', e => {
            e.preventDefault(); e.stopPropagation();
            const a = b.dataset.a;
            if (a === 'del' && !confirm('Remove ' + (f.itemLabel || 'item') + ' ' + (i + 1) + '?')) return;
            if (a === 'up' && i > 0) items.splice(i - 1, 0, items.splice(i, 1)[0]);
            if (a === 'down' && i < items.length - 1) items.splice(i + 1, 0, items.splice(i, 1)[0]);
            if (a === 'dup') items.splice(i + 1, 0, JSON.parse(JSON.stringify(item)));
            if (a === 'del') items.splice(i, 1);
            onStructure();
          }));
          list.appendChild(d);
        });
        const add = document.createElement('button'); add.type = 'button'; add.textContent = '+ Add ' + (f.itemLabel || 'item').toLowerCase();
        add.addEventListener('click', () => { items.push(GEN.defaults(f.fields)); onStructure(); });
        list.appendChild(add);
        wrap.appendChild(list);
        container.appendChild(wrap);
        return;
      }
      const val = obj[f.key] == null ? '' : obj[f.key];
      const esc = GEN.makeHelpers().esc;
      const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
      if (f.type === 'checkbox') {
        wrap.innerHTML = `<label for="${id}"><input type="checkbox" id="${id}"${val ? ' checked' : ''}${describedBy}> ${esc(f.label)}</label>${help}`;
      } else if (f.type === 'select') {
        const opts = (f.options || []).map(o => `<option value="${esc(o)}"${String(val) === String(o) ? ' selected' : ''}>${esc(o || '(none)')}</option>`).join('');
        wrap.innerHTML = `<label for="${id}">${esc(f.label)}</label><select id="${id}"${describedBy}>${opts}</select>${help}`;
      } else if (f.type === 'textarea') {
        wrap.innerHTML = `<label for="${id}">${esc(f.label)}</label><textarea id="${id}"${ph}${describedBy}>${esc(val)}</textarea>${help}`;
      } else {
        const t = { url: 'url', email: 'email', tel: 'tel', date: 'date', time: 'time', number: 'number', image: 'url' }[f.type] || 'text';
        const isLink = f.type === 'url' || f.type === 'image';
        wrap.innerHTML = isLink
          ? `<label for="${id}">${esc(f.label)}</label><div class="urlrow"><input type="${t}" id="${id}" value="${esc(val)}" placeholder="${esc(f.placeholder || 'https://')}"${describedBy}><button type="button" class="open-link" aria-label="Open ${esc(f.label)} in a new tab">Open</button></div>${help}`
          : `<label for="${id}">${esc(f.label)}</label><input type="${t}" id="${id}" value="${esc(val)}"${ph}${describedBy}>${help}`;
        if (isLink) {
          const btn = wrap.querySelector('.open-link');
          const sync = () => { const u = String(wrap.querySelector('input').value || '').trim(); btn.disabled = !/^https?:\/\//i.test(u); btn.title = btn.disabled ? 'Enter a full address starting with https://' : 'Open this link in a new tab to check it'; };
          btn.addEventListener('click', () => { const u = String(wrap.querySelector('input').value || '').trim(); if (/^https?:\/\//i.test(u)) window.open(u, '_blank', 'noopener'); });
          wrap._syncLink = sync;
        }
      }
      const input = wrap.querySelector('#' + id);
      if (wrap._syncLink) { wrap._syncLink(); input.addEventListener('input', wrap._syncLink); }
      const structural = fields.some(x => x.showIf && x.showIf.replace(/^!/, '') === f.key);
      input.addEventListener(f.type === 'checkbox' || f.type === 'select' ? 'change' : 'input', () => {
        obj[f.key] = f.type === 'checkbox' ? input.checked : f.type === 'number' ? (input.value === '' ? '' : Number(input.value)) : input.value;
        if (structural) onStructure(); else onValue();
      });
      container.appendChild(wrap);
    });
  }

  /* ---------- main views ---------- */
  let timer;
  function onValue() { save(); clearTimeout(timer); timer = setTimeout(() => { updateOutput(); renderNav(); }, 200); }

  function renderAll() {
    renderNav();
    const main = document.getElementById('main');
    const esc = GEN.makeHelpers().esc;
    if (SETUP[view]) {
      const isSchool = view !== 'course';
      const S = SETUP[view];
      main.innerHTML = `<div class="work single"><div>
        <div class="card"><h2>${S.title}</h2>
        <p class="desc">${S.desc}</p>
        ${view === 'course' ? '<div id="picker"></div><div id="recordStatus"></div>' : ''}
        <div id="form"></div>
        ${isSchool ? '<div class="bar"><button type="button" id="btnSchoolReset">Restore built-in values</button><button type="button" id="btnSchoolExport">Download school settings</button><button type="button" id="btnSchoolImport">Load school settings file</button><input type="file" id="fileSchool" accept=".json,application/json" class="sr" aria-label="Load school settings file"></div><p class="muted">The download includes the policies, academic calendar, programs and course catalog. Use Load school settings file to replace them with an updated file. To make changes the built-in values for everyone, send the downloaded file to Claude and ask to update the generator\'s school defaults.</p>' : ''}
        </div></div></div>`;
      const obj = isSchool ? school : profile.course;
      const flds = isSchool ? GEN.SCHOOL_FIELDS.filter(f => (f.group || 'school') === view) : GEN.COURSE_FIELDS;
      renderFields(document.getElementById('form'), flds, obj, () => { save(); renderAll(); });
      if (view === 'course') { renderPicker(); updateRecordStatus(); }
      if (isSchool) {
        document.getElementById('btnSchoolReset').onclick = () => { if (confirm('Replace your school-wide settings with the built-in values?')) { school = JSON.parse(JSON.stringify(builtSchool)); store.del(KEY_SCHOOL); renderAll(); } };
        document.getElementById('btnSchoolExport').onclick = () => download('school-settings.json', JSON.stringify(school, null, 2), 'application/json');
        document.getElementById('btnSchoolImport').onclick = () => document.getElementById('fileSchool').click();
        document.getElementById('fileSchool').onchange = e => {
          const f = e.target.files[0]; if (!f) return;
          const rd = new FileReader();
          rd.onload = () => {
            try {
              const d = JSON.parse(rd.result);
              if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('not a settings object');
              if (!confirm('Replace your school-wide settings, programs and course catalog with this file? Fields the file leaves out keep their built-in values.')) return;
              school = GEN.merge(GEN.SCHOOL_FIELDS, Object.assign({}, builtSchool, d)); save(); renderAll();
            } catch (err) { alert('That file could not be loaded as school settings: ' + err.message); }
            e.target.value = '';
          };
          rd.readAsText(f);
        };
      }
      return;
    }
    const comp = GEN.components.find(c => c.id === view) || GEN.components[0];
    if (!comp) { main.innerHTML = '<p>No components are built into this generator.</p>'; return; }
    view = comp.id;
    main.innerHTML = `<div class="work">
      <div><div class="card"><h2>${esc(comp.name)}</h2>
        <p class="desc">${esc(comp.description || '')}${comp.placement ? '<br><strong>Where it goes:</strong> ' + esc(comp.placement) : ''}</p>
        <div id="form"></div>
        <div class="bar"><button type="button" id="btnCompReset">Reset this component</button></div>
      </div></div>
      <div class="preview-wrap">
        <div id="missing"></div>
        <div class="bar">
          <div class="tabs" role="tablist" aria-label="Output view">
            <button type="button" role="tab" data-tab="preview" aria-selected="${outTab === 'preview'}">Preview</button>
            <button type="button" role="tab" data-tab="code" aria-selected="${outTab === 'code'}">HTML code</button>
          </div>
          <button type="button" class="primary" id="btnCopy">Copy HTML</button>
          <button type="button" id="btnDownload">Download .html</button>
          <span class="status" id="status" role="status" aria-live="polite"></span>
        </div>
        <iframe id="preview" title="Preview of ${esc(comp.name)}"${outTab === 'preview' ? '' : ' hidden'}></iframe>
        <textarea class="code" id="code" readonly aria-label="Generated HTML"${outTab === 'code' ? '' : ' hidden'}></textarea>
        <p class="muted">Paste into Moodle using the editor's Source code view (the &lt;&gt; button), not the normal editing view.</p>
      </div></div>`;
    renderFields(document.getElementById('form'), comp.fields, profile.comps[comp.id], () => { save(); renderAll(); });
    document.getElementById('btnCompReset').onclick = () => { if (confirm('Clear everything entered for ' + comp.name + '?')) { profile.comps[comp.id] = GEN.merge(comp.fields, {}); save(); renderAll(); } };
    main.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { outTab = b.dataset.tab; renderAll(); });
    document.getElementById('btnCopy').onclick = copyOut;
    document.getElementById('btnDownload').onclick = () => {
      const r = current(); const slug = (profile.course.courseCode || 'course').replace(/[^A-Za-z0-9]+/g, '-');
      download(slug + '_' + comp.id + '.html', r.html, 'text/html');
    };
    updateOutput();
  }
  /* ---------- course picker: choose a course from the catalog ---------- */
  let pickProgram = store.get('kpsahs-gen:pickProgram') || '';
  function renderPicker() {
    const el = document.getElementById('picker'); if (!el) return;
    const esc = GEN.makeHelpers().esc;
    const courses = (school.courses || []).filter(c => c && c.courseCode);
    const programs = Array.from(new Set(courses.map(c => c.program).filter(Boolean))).sort();
    if (pickProgram && programs.indexOf(pickProgram) < 0) pickProgram = '';
    const shown = courses.filter(c => !pickProgram || c.program === pickProgram)
      .sort((a, b) => String(a.courseCode).localeCompare(String(b.courseCode), undefined, { numeric: true }));
    const label = c => c.courseCode + ': ' + (c.courseTitle || '');
    const cur = GEN.lookupCourse(ctx());
    el.innerHTML = `<fieldset class="picker"><legend>Choose a course from the catalog</legend>
      <p class="help">Pick a program and course, or search by course code or title. This fills the program, course code and title below and loads the catalog record for every syllabus chapter.</p>
      <div class="pickrow">
        <div class="field"><label for="pkProg">Program</label><select id="pkProg"><option value="">All programs (${courses.length} courses)</option>${programs.map(p => `<option value="${esc(p)}"${p === pickProgram ? ' selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
        <div class="field"><label for="pkCourse">Course</label><select id="pkCourse"><option value="">Select a course (${shown.length})</option>${shown.map(c => `<option value="${esc(c.courseCode)}"${cur && cur.courseCode === c.courseCode ? ' selected' : ''}>${esc(label(c))}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label for="pkSearch">Or search by course code or title</label>
        <div class="urlrow"><input type="text" id="pkSearch" list="pkList" placeholder="e.g., RD 324 or Radiographic Procedures" autocomplete="off"><button type="button" id="pkGo">Use this course</button></div>
        <datalist id="pkList">${courses.map(c => `<option value="${esc(label(c))}"></option>`).join('')}</datalist>
        <p class="help" id="pkMsg" role="status" aria-live="polite"></p></div>
      ${cur ? recordSummary(cur) : ''}
    </fieldset>`;
    document.getElementById('pkProg').onchange = e => { pickProgram = e.target.value; store.set('kpsahs-gen:pickProgram', pickProgram); renderPicker(); document.getElementById('pkProg').focus(); };
    document.getElementById('pkCourse').onchange = e => { const c = courses.find(x => x.courseCode === e.target.value); if (c) useCourse(c); };
    const search = () => {
      const q = document.getElementById('pkSearch').value.trim(); if (!q) return;
      const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      const code = q.split(':')[0];
      let hits = courses.filter(c => norm(c.courseCode) === norm(code));
      if (!hits.length) hits = courses.filter(c => label(c).toLowerCase() === q.toLowerCase());
      if (!hits.length) hits = courses.filter(c => String(c.courseTitle || '').toLowerCase() === q.toLowerCase());
      if (!hits.length) hits = courses.filter(c => label(c).toLowerCase().indexOf(q.toLowerCase()) >= 0);
      const msg = document.getElementById('pkMsg');
      if (hits.length === 1) useCourse(hits[0]);
      else if (!hits.length) msg.textContent = 'No catalog course matches "' + q + '". Check the code, or add the course on the Course catalog tab.';
      else msg.textContent = hits.length + ' courses match. Pick one from the list as you type, or use the Course dropdown.';
    };
    document.getElementById('pkGo').onclick = search;
    document.getElementById('pkSearch').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); search(); } });
    document.getElementById('pkSearch').addEventListener('change', e => { if ((school.courses || []).some(c => label(c) === e.target.value)) search(); });
  }
  function useCourse(c) {
    const C = profile.course;
    if (C.courseCode && GEN.lookupCourse(ctx()) && GEN.lookupCourse(ctx()).courseCode !== c.courseCode &&
        !confirm('Switch this course from ' + C.courseCode + ' to ' + c.courseCode + '? The program, code and title change; everything else you entered stays.')) { renderPicker(); return; }
    C.courseCode = c.courseCode; C.program = c.program || ''; C.courseTitle = c.courseTitle || '';
    if (!C.modality && c.catalogFormat === 'In person') C.modality = 'In person';
    pickProgram = c.program || pickProgram; store.set('kpsahs-gen:pickProgram', pickProgram);
    save(); renderAll();
    const s = document.getElementById('status') || document.getElementById('pkMsg'); if (s) s.textContent = 'Loaded ' + c.courseCode + ' from the catalog.';
    const f = document.getElementById('pkCourse'); if (f) f.focus();
  }
  function recordSummary(c) {
    const esc = GEN.makeHelpers().esc, v = x => (x === '' || x == null) ? '<em>not set</em>' : esc(x);
    const hrs = ['hoursOnsite', 'hoursSync', 'hoursAsync'].some(k => c[k] !== '' && c[k] != null);
    const outs = (c.outcomes || []).filter(o => o && String(o.outcome || '').trim()).length;
    const sig = (c.signatureAssignments || []).filter(o => o && String(o.name || '').trim()).length;
    const todo = [!outs && 'learning outcomes', !hrs && 'scheduled hours', !sig && 'signature assignments'].filter(Boolean);
    return `<table class="recsum"><caption>Catalog record for ${esc(c.courseCode)}</caption><tbody>
      <tr><th scope="row">Title</th><td>${v(c.courseTitle)}</td></tr>
      <tr><th scope="row">Program</th><td>${v(c.program)}</td></tr>
      <tr><th scope="row">Credits</th><td>${v(c.quarterCredits)}${c.hasLabCourse && c.labCourseCode ? ' (with ' + esc(c.labCourseCode) + ', ' + v(c.labQuarterCredits) + ')' : ''}</td></tr>
      <tr><th scope="row">Course type</th><td>${v(c.courseType)}</td></tr>
      <tr><th scope="row">Catalog format</th><td>${v(c.catalogFormat)}</td></tr>
      <tr><th scope="row">Prerequisites</th><td>${v(c.prerequisites)}</td></tr>
    </tbody></table>
    ${todo.length ? `<p class="missing">Still needed in this catalog record: ${todo.join(', ')}. Add them on the Course catalog tab.</p>` : '<p class="muted">This catalog record has learning outcomes, hours and signature assignments.</p>'}`;
  }

  /* Shows which catalog and program records Course details picked up. */
  function updateRecordStatus() {
    const el = document.getElementById('recordStatus'); if (!el) return;
    const esc = GEN.makeHelpers().esc;
    const rec = GEN.lookupCourse(ctx()), prog = GEN.lookupProgram(ctx());
    const code = profile.course.courseCode;
    const msg = !code ? 'Enter a course code to load its catalog record.'
      : (rec ? 'Catalog record found: <strong>' + esc(rec.courseCode) + ' ' + esc(rec.courseTitle || '') + '</strong>.'
             : 'No catalog record for <strong>' + esc(code) + '</strong> yet. Add it on the Course catalog tab.')
        + ' ' + (prog ? 'Program record: <strong>' + esc(prog.name) + '</strong>.' : 'No matching program record yet (Programs tab).')
        + ' ' + (GEN.lookupTerm(ctx()) ? 'Academic calendar dates found for <strong>' + esc(profile.course.term) + '</strong>.' : (profile.course.term ? 'No academic calendar quarter matches the term "' + esc(profile.course.term) + '".' : ''));
    el.innerHTML = '<p class="' + (rec && prog ? 'muted' : 'missing') + '" role="status">' + msg + '</p>';
  }
  function current() { const comp = GEN.components.find(c => c.id === view); return GEN.render(comp, profile.comps[comp.id], ctx()); }
  function updateOutput() {
    if (view === 'course') updateRecordStatus();
    if (SETUP[view]) return;
    const r = current();
    const code = document.getElementById('code'); if (code) code.value = r.html;
    const fr = document.getElementById('preview');
    if (fr) fr.srcdoc = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:16px;background:#fff;color:#1f2933;font:15px/1.5 -apple-system,\'Segoe UI\',Roboto,Arial,sans-serif;">' + r.html + '</body></html>';
    const m = document.getElementById('missing');
    if (m) m.innerHTML = r.missing.length
      ? `<div class="missing"><strong>${r.missing.length} to fill in or fix</strong> (empty fields show as [placeholders] in the output): ${r.missing.map(x => GEN.makeHelpers().esc(x)).join('; ')}</div>`
      : '';
  }
  function flash(msg) { const s = document.getElementById('status'); if (s) { s.textContent = msg; setTimeout(() => { s.textContent = ''; }, 2500); } }
  function copyOut() {
    const html = current().html;
    const fallback = () => { const t = document.getElementById('code'); t.hidden = false; t.value = html; t.select(); try { document.execCommand('copy'); flash('Copied'); } catch (e) { flash('Select the code and copy it'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(html).then(() => flash('Copied'), fallback); else fallback();
  }
  function download(name, text, type) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- profiles ---------- */
  document.getElementById('btnNew').onclick = () => { if (confirm('Start a new course? Save the current course profile first if you want to keep it.')) { profile = loadProfile(null); view = 'course'; save(); renderAll(); } };
  document.getElementById('btnSave').onclick = () => {
    const out = { generator: 'kpsahs-moodle-syllabus-generator', generatorVersion: GEN.version, savedAt: new Date().toISOString(),
      componentVersions: Object.fromEntries(GEN.components.map(c => [c.id, c.version])), course: profile.course, comps: profile.comps };
    const slug = [profile.course.courseCode, profile.course.term].filter(Boolean).join('_').replace(/[^A-Za-z0-9]+/g, '-') || 'course';
    download(slug + '_profile.json', JSON.stringify(out, null, 2), 'application/json');
  };
  document.getElementById('btnOpen').onclick = () => document.getElementById('fileOpen').click();
  document.getElementById('fileOpen').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { const p = JSON.parse(rd.result); if (!['kpsahs-moodle-syllabus-generator', 'kpsahs-moodle-generator'].includes(p.generator)) throw new Error('Not a generator profile'); profile = loadProfile(p); view = 'course'; save(); renderAll(); }
      catch (err) { alert('That file could not be opened as a course profile: ' + err.message); }
      e.target.value = '';
    };
    rd.readAsText(f);
  };

  const bi = GEN.BUILD_INFO || {};
  document.getElementById('buildInfo').textContent = 'Built ' + (bi.builtOn || '') + ' · ' + GEN.components.length + ' components';
  renderAll();
})();
</script>
</body>
</html>
