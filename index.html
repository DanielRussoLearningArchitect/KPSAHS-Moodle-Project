<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPSAHS Moodle Syllabus Generator</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #1f2933; --muted: #4a5560; --line: #c9d3dc;
    --soft: #eef4f8; --brand: #006ba6; --brand-ink: #ffffff; --warn-bg: #fff4ce; --warn-ink: #3d2e00;
    --ok: #1d6b3a; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161b; --panel: #1b2128; --ink: #e6ebf0; --muted: #a9b4bf; --line: #34404c;
      --soft: #22303c; --brand: #3b9fd8; --brand-ink: #0b1116; --warn-bg: #3a3214; --warn-ink: #f5e6a8;
      --ok: #6fcf97; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161b; --panel: #1b2128; --ink: #e6ebf0; --muted: #a9b4bf; --line: #34404c;
    --soft: #22303c; --brand: #3b9fd8; --brand-ink: #0b1116; --warn-bg: #3a3214; --warn-ink: #f5e6a8;
    --ok: #6fcf97; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: var(--brand); color: var(--brand-ink); padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.1em; margin: 0; }
  header .sub { font-size: 0.8em; opacity: 0.9; }
  header .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button, .btn { font: inherit; font-size: 0.88em; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  header button { border-color: transparent; }
  button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, nav a:focus-visible { outline: 3px solid #f2b705; outline-offset: 1px; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100% - 52px); }
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 0; }
  nav h2 { font-size: 0.72em; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 14px 16px 6px; }
  nav a { display: block; padding: 7px 16px; color: var(--ink); text-decoration: none; border-left: 4px solid transparent; font-size: 0.93em; }
  nav a[aria-current="page"] { background: var(--soft); border-left-color: var(--brand); font-weight: 600; }
  nav .count { float: right; font-size: 0.75em; color: var(--muted); }
  main { padding: 16px 20px 40px; min-width: 0; }
  .work { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 18px; align-items: start; }
  .work.single { grid-template-columns: minmax(300px, 680px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card + .card { margin-top: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 1.1em; }
  .card .desc { margin: 0 0 12px; color: var(--muted); font-size: 0.88em; }
  .field { margin: 0 0 12px; }
  .field label { display: block; font-weight: 600; font-size: 0.88em; margin: 0 0 3px; }
  .field .help { color: var(--muted); font-size: 0.8em; margin: 2px 0 0; }
  .field input[type=text], .field input[type=url], .field input[type=email], .field input[type=tel],
  .field input[type=date], .field input[type=time], .field input[type=number], .field select, .field textarea {
    width: 100%; font: inherit; font-size: 0.92em; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .urlrow { display: flex; gap: 6px; }
  .urlrow input { flex: 1; min-width: 0; }
  .urlrow button:disabled { opacity: 0.5; cursor: not-allowed; }
  .group-head { margin: 22px 0 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .group-head:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .group-head h3 { margin: 0 0 2px; font-size: 1em; color: var(--brand); }
  .group-head .help { margin: 0; color: var(--muted); font-size: 0.82em; }
  .field.check label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .list { border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--soft); }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin: 0 0 8px; }
  .item > summary { cursor: pointer; padding: 7px 10px; font-weight: 600; font-size: 0.9em; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .item > summary .tools { display: flex; gap: 4px; }
  .item > summary .tools button { padding: 2px 8px; font-size: 0.8em; }
  .item .inner { padding: 4px 12px 2px; }
  .preview-wrap { position: sticky; top: 12px; }
  .tabs { display: flex; gap: 4px; margin: 0 0 8px; flex-wrap: wrap; }
  .tabs button[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  iframe { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; }
  textarea.code { width: 100%; height: 70vh; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); color: var(--ink); }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }
  .status { font-size: 0.85em; color: var(--ok); min-height: 1.2em; }
  .picker { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px 4px; margin: 0 0 14px; background: var(--soft); }
  .picker legend { font-weight: 700; padding: 0 6px; }
  .picker .help { color: var(--muted); font-size: 0.8em; margin: 0 0 10px; }
  .pickrow { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  @media (max-width: 700px) { .pickrow { grid-template-columns: 1fr; } }
  .recsum { width: 100%; border-collapse: collapse; margin: 4px 0 8px; font-size: 0.85em; background: var(--panel); }
  .recsum caption { text-align: left; font-weight: 600; padding: 0 0 4px; }
  .recsum th { text-align: left; width: 32%; color: var(--muted); font-weight: 600; }
  .recsum th, .recsum td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .missing { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 8px 12px; font-size: 0.85em; margin: 0 0 8px; }
  .missing ul { margin: 4px 0 0 18px; padding: 0; }
  .muted { color: var(--muted); font-size: 0.85em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav { border-right: none; border-bottom: 1px solid var(--line); }
    .work { grid-template-columns: 1fr; }
    .preview-wrap { position: static; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>KPSAHS Moodle Syllabus Generator</h1>
    <div class="sub" id="buildInfo"></div>
  </div>
  <div class="actions">
    <button type="button" id="btnNew">New course</button>
    <button type="button" id="btnOpen">Open course profile</button>
    <button type="button" id="btnSave">Save course profile</button>
    <input type="file" id="fileOpen" accept=".json,application/json" class="sr" aria-label="Open course profile file">
  </div>
</header>
<div class="layout">
  <nav aria-label="Generator sections" id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* KPSAHS Moodle Syllabus Generator: core runtime.
   Shared by the generator page (browser) and scripts/render_component.js (Node).
   Components call GEN.registerComponent({...}); icons call GEN.registerIcon(...). */
(function (root) {
  const GEN = (root.GEN = root.GEN || { components: [], icons: {} });
  GEN.version = '1.2';

  /* ---------- registration ---------- */
  GEN.registerComponent = function (def) {
    ['id', 'name', 'version', 'fields', 'render'].forEach(k => {
      if (!(k in def)) throw new Error('Component missing "' + k + '": ' + (def.id || '?'));
    });
    if (!/^[a-z0-9-]+$/.test(def.id)) throw new Error('Component id must be lowercase-with-hyphens: ' + def.id);
    const i = GEN.components.findIndex(c => c.id === def.id);
    if (i >= 0) GEN.components[i] = def; else GEN.components.push(def);
  };
  GEN.registerIcon = function (name, src, alt) { GEN.icons[name] = { src, alt: alt || name }; };

  /* ---------- defaults and merging ---------- */
  function fieldDefault(f) {
    if ('default' in f) return JSON.parse(JSON.stringify(f.default));
    if (f.type === 'list') return [];
    if (f.type === 'checkbox') return false;
    return '';
  }
  GEN.defaults = function (fields) {
    const o = {};
    (fields || []).forEach(f => { if (f.type !== 'heading') o[f.key] = fieldDefault(f); });
    return o;
  };
  /* Saved values win. Keys added in newer component versions get their defaults.
     A component's migrate(values) runs first so renamed keys carry over. */
  GEN.merge = function (fields, saved, migrate) {
    let s = saved ? JSON.parse(JSON.stringify(saved)) : {};
    if (migrate) s = migrate(s) || s;
    const out = GEN.defaults(fields);
    (fields || []).forEach(f => {
      if (f.type === 'heading' || !(f.key in s)) return;
      if (f.type === 'list' && Array.isArray(s[f.key])) {
        out[f.key] = s[f.key].map(item => GEN.merge(f.fields, item));
      } else out[f.key] = s[f.key];
    });
    return out;
  };

  /* ---------- helpers passed to render(v, ctx, h) ---------- */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
  const blank = v => v == null || String(v).trim() === '';
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAYS_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function parseISO(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
    return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
  }
  const toISO = d => d.toISOString().slice(0, 10);

  GEN.makeHelpers = function (missing) {
    const note = label => { if (missing && label && missing.indexOf(label) < 0) missing.push(label); };
    const h = {
      esc, blank,
      /* Text value, escaped. Empty -> visible [Label] placeholder, listed as missing. */
      text(v, label) { if (blank(v)) { note(label); return esc('[' + (label || 'Text') + ']'); } return esc(v); },
      /* Optional text: empty -> '' and not listed as missing. */
      opt(v) { return blank(v) ? '' : esc(v); },
      /* Multi-line text -> escaped, line breaks become <br>. */
      lines(v, label) { if (blank(v)) { note(label); return esc('[' + (label || 'Text') + ']'); } return esc(v).replace(/\r?\n/g, '<br>'); },
      /* Paragraphs split on blank lines, each wrapped in <p style="...">. */
      paras(v, label, style) {
        const st = style || 'margin: 0 0 10px;';
        if (blank(v)) { note(label); return '<p style="' + st + '">' + esc('[' + (label || 'Text') + ']') + '</p>'; }
        return String(v).trim().split(/\n\s*\n/).map(p => '<p style="' + st + '">' + esc(p).replace(/\r?\n/g, '<br>') + '</p>').join('\n');
      },
      /* URL for href/src. Allows http(s), mailto:, tel:, #anchors and site-relative paths.
         Empty or unsafe -> [LABEL URL] placeholder, listed as missing. */
      url(v, label) {
        const s = String(v || '').trim();
        if (/^(https?:\/\/|mailto:|tel:|#|\/)/i.test(s)) return esc(s);
        note(label);
        return esc('[' + (label || 'Link').toUpperCase() + ' URL]');
      },
      mailto(v, label) { return blank(v) ? h.url('', label) : esc('mailto:' + String(v).trim()); },
      tel(v, label) { return blank(v) ? h.url('', label) : esc('tel:' + String(v).replace(/[^\d+]/g, '')); },
      /* Inline <img> icon from the icon library. opts: {alt, size, gap}.
         Use alt: '' when a visible word next to the icon already names it. */
      icon(name, opts) {
        const ic = GEN.icons[name]; const o = opts || {};
        if (!ic) return '';
        const size = o.size || 20, gap = o.gap == null ? 6 : o.gap;
        const alt = o.alt == null ? ic.alt : o.alt;
        return '<img src="' + ic.src + '" alt="' + esc(alt) + '" width="' + size + '" height="' + size +
          '" style="width: ' + size + 'px; height: ' + size + 'px; vertical-align: middle; margin-right: ' + gap + 'px;">';
      },
      /* Dates (iso = 'YYYY-MM-DD'). fmt: short "Mon, Oct 5" (default) | md "Oct 5"
         | full "October 5, 2026" | long "Monday, October 5, 2026" | iso.
         Empty or invalid -> [placeholder] (listed as missing only if label given). */
      date(iso, fmt, label) {
        const d = parseISO(iso);
        if (!d) { note(label); return esc('[' + (label || (fmt === 'md' ? 'Mon DD' : fmt === 'full' ? 'Month Day, Year' : 'Day, Mon DD')) + ']'); }
        const wd = d.getUTCDay(), m = d.getUTCMonth(), day = d.getUTCDate(), y = d.getUTCFullYear();
        switch (fmt) {
          case 'md': return MONTHS[m] + ' ' + day;
          case 'full': return MONTHS_LONG[m] + ' ' + day + ', ' + y;
          case 'long': return DAYS_LONG[wd] + ', ' + MONTHS_LONG[m] + ' ' + day + ', ' + y;
          case 'iso': return toISO(d);
          default: return DAYS[wd] + ', ' + MONTHS[m] + ' ' + day;
        }
      },
      parseDate: parseISO,
      addDays(iso, n) { const d = parseISO(iso); if (!d) return ''; d.setUTCDate(d.getUTCDate() + n); return toISO(d); },
      /* Week i (0-based) of a course: {start, end} ISO strings, blanks if no start date. */
      week(startIso, i) { if (!parseISO(startIso)) return { start: '', end: '' }; const s = h.addDays(startIso, 7 * i); return { start: s, end: h.addDays(s, 6) }; },
      /* First date on or after fromIso that falls on weekday ('Monday', ...). '' if unknown. */
      onWeekday(fromIso, weekday) {
        const d = parseISO(fromIso); const t = DAYS_LONG.indexOf(weekday);
        if (!d || t < 0) return '';
        d.setUTCDate(d.getUTCDate() + ((t - d.getUTCDay() + 7) % 7)); return toISO(d);
      },
      /* Holiday name from school-wide settings for this date, or ''. */
      holiday(iso, ctx) {
        const list = (ctx && ctx.school && ctx.school.holidays) || [];
        const hit = list.find(x => x && x.date === iso); return hit ? (hit.name || 'Holiday') : '';
      },
      /* A problem to fix that is not a blank field (e.g., grading total is not 100%).
         Listed in the generator's attention panel; adds nothing to the output. */
      warn(label) { note(label); return ''; },
      /* 'HH:MM' (24h, from a time picker) -> '9:00 am'. Other text passes through escaped. */
      time(v, label) {
        if (blank(v)) { note(label); return esc('[' + (label || 'Time') + ']'); }
        const m = /^(\d{1,2}):(\d{2})$/.exec(String(v).trim());
        if (!m) return esc(v);
        let hr = +m[1]; const ap = hr >= 12 ? 'pm' : 'am'; hr = hr % 12 || 12;
        return hr + ':' + m[2] + ' ' + ap;
      },
      /* Start and end times -> '9:00 am–12:00 pm'. */
      timeRange(a, b, label) {
        if (blank(a) && blank(b)) { note(label); return esc('[' + (label || 'Time') + ']'); }
        return h.time(a, (label || 'Time') + ' (start)') + '–' + h.time(b, (label || 'Time') + ' (end)');
      },
      /* Course catalog record and program record from school-wide settings, matched on
         the course code and program name in Course details. Missing records are listed. */
      record(ctx) {
        const r = GEN.lookupCourse(ctx);
        if (!r) note('Course catalog record for ' + ((ctx && ctx.course && ctx.course.courseCode) || 'this course code'));
        return r || {};
      },
      program(ctx) {
        const p = GEN.lookupProgram(ctx);
        if (!p) note('Program record for ' + ((ctx && ctx.course && ctx.course.program) || 'this program'));
        return p || {};
      },
      today() { return toISO(new Date()); },
      when(cond, html) { return cond ? html : ''; },
      join(arr, sep) { return arr.filter(Boolean).join(sep == null ? '\n' : sep); }
    };
    return h;
  };

  /* ---------- catalog and program lookups ---------- */
  const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const normName = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  GEN.lookupCourse = function (ctx) {
    const code = normCode(ctx && ctx.course && ctx.course.courseCode);
    if (!code) return null;
    return ((ctx.school && ctx.school.courses) || []).find(c => c && normCode(c.courseCode) === code) || null;
  };
  GEN.lookupProgram = function (ctx) {
    const rec = GEN.lookupCourse(ctx);
    const name = normName((ctx && ctx.course && ctx.course.program) || (rec && rec.program));
    if (!name) return null;
    return ((ctx.school && ctx.school.programs) || []).find(p => p && normName(p.name) === name) || null;
  };

  /* Academic calendar quarter matching Course details > Term ("Fall Quarter 2026" = "Fall 2026"). */
  const normTerm = s => String(s || '').toLowerCase().replace(/quarter/g, '').replace(/[^a-z0-9]/g, '');
  GEN.lookupTerm = function (ctx) {
    const t = normTerm(ctx && ctx.course && ctx.course.term);
    if (!t) return null;
    return ((ctx.school && ctx.school.quarters) || []).find(q => q && normTerm(q.term) === t) || null;
  };
  /* What components see: Course details with blanks filled from the academic calendar
     (start and end dates) and the course catalog (modality), plus ctx.term. Saved values
     are never changed. course._modalityFromCatalog is true when modality came from the catalog. */
  GEN.effectiveContext = function (ctx) {
    const base = ctx || { school: {}, course: {} };
    const c = Object.assign({}, base.course || {});
    const q = GEN.lookupTerm(base);
    if (q) {
      if (!c.startDate && q.firstDay) c.startDate = q.firstDay;
      if (!c.endDate && (q.finalsEnd || q.lastDay)) c.endDate = q.finalsEnd || q.lastDay;
    }
    const r = GEN.lookupCourse(base);
    if (r && !c.modality && r.catalogFormat) { c.modality = r.catalogFormat; c._modalityFromCatalog = true; }
    return Object.assign({}, base, { course: c, term: q || null });
  };

  /* Render a component. Returns {html, missing}. */
  GEN.render = function (def, values, ctx) {
    const missing = [];
    const h = GEN.makeHelpers(missing);
    const v = GEN.merge(def.fields, values, def.migrate);
    const c = GEN.effectiveContext(ctx || { school: {}, course: {} });
    const body = def.render(v, c, h);
    const stamp = '<!-- ===== ' + def.name + ' ===== -->\n<!-- Generated by the KPSAHS Moodle Syllabus Generator (' + def.id +
      ' v' + def.version + ') on ' + h.today() + '. To change it, edit the generator form and paste again. -->\n';
    return { html: stamp + String(body).trim() + '\n', missing };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = GEN;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* KPSAHS icon library. Add new icons with GEN.registerIcon(name, dataUri, defaultAlt).
   Icons are inline SVG data URIs (24x24 viewBox, colored circle, white glyph), so there are
   no files to upload and nothing breaks when a course is copied to a new term.
   Colors: KP Blue #006ba6, Zoom teal #0b7a82, Lab gray #4a5560. */
GEN.registerIcon('class', "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23006ba6'/%3E%3Crect x='5.5' y='6.5' width='13' height='8.5' rx='1' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9 15l-1.5 3.5M15 15l1.5 3.5M8.5 10h4' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E", 'In-person class');
GEN.registerIcon('zoom', "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%230b7a82'/%3E%3Crect x='5' y='8' width='9.5' height='8' rx='1.6' fill='%23fff'/%3E%3Cpath d='M15.5 11.2l3.8-2.2v6l-3.8-2.2z' fill='%23fff'/%3E%3C/svg%3E", 'Zoom session');
GEN.registerIcon('lab', "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%234a5560'/%3E%3Cpath d='M10 5.5h4M10.8 5.5v4.7L6.6 17.4a1 1 0 0 0 .9 1.4h9a1 1 0 0 0 .9-1.4l-4.2-7.2V5.5' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M8.4 15h7.2l1.2 2.4H7.2z' fill='%23fff'/%3E%3C/svg%3E", 'Lab');
GEN.registerIcon('assignment', "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23006ba6'/%3E%3Cpath d='M7.5 5.5h6l3 3v10h-9z' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M13.5 5.5v3h3M10 12.5h4M10 15.5h4' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E", 'Assignment');

</script>
<script>
/* Shared fields. Entered once, available to every component as ctx.school.* and ctx.course.*.

   SCHOOL fields hold everything that is the same across course sections. Each has a
   `group` that decides which Setup tab shows it:

    {
      "title": "Attendance: In-Person and Online Synchronous Classes",
      "appliesTo": "In-person and online synchronous classes",
      "program": "",
      "summary": "Attendance will be taken during each class and will be recorded based on the number of minutes attended. A tardy is defined as arrival after the scheduled start time.\n## Student responsibilities\nIf a student will be absent, they must contact the instructor prior to the scheduled start time. It is the student's responsibility to obtain all missed material.\n## Make-up work\nMake-up work is at the discretion of the instructor and is not guaranteed; however, missed laboratory activities cannot be made up.\n## Consequences\nA student who misses 10% in any didactic course may have their course grade lowered one full grade. A student who misses 20% in any didactic course may have their course grade lowered two full grades. A student who misses more than 30% may receive a failing grade and may be dismissed from the program. Exceptions to this policy may be approved by the program director.",
      "url": "",
      "contactEmail": "",
      "addOn": "Course attendance details",
      "source": "2026 KPSAHS Academic Catalog (v.2026-10-23), p. 121"
    },
    {
      "title": "Attendance: Hybrid Classes",
      "appliesTo": "Hybrid classes",
      "program": "",
      "summary": "Attendance for hybrid courses is recorded for both the on-campus and online components.\n## On-campus attendance\nAttendance will be taken during each on-campus class session and will be recorded based on the number of minutes attended. A tardy is defined as arrival after the scheduled start time.\n## Online attendance\nStudents are counted present in the online portion of the course when at least one of the following occurs within the week:\n- participating in an online webinar such as Zoom, WebEx, or MS Teams\n- submitting an assignment\n- completing a test or quiz\n- posting to a discussion board\n- completing a course evaluation form\nAttendance is entered weekly for the number of minutes the online component requires. The attendance week begins Monday at 12:00 a.m. Pacific time and ends the following Sunday at 11:59 p.m., except in the final week of the quarter, when it ends Friday at 11:59 p.m.\n## Student responsibilities\nIf a student will be absent, they must contact the instructor prior to the scheduled start time. It is the student's responsibility to obtain all missed material.\n## Make-up work\nMake-up work is at the discretion of the instructor and is not guaranteed; however, missed laboratory activities cannot be made up.\n## Consequences\nA student who misses 10% in any hybrid course may have their course grade lowered one full grade. A student who misses 20% in any hybrid course may have their course grade lowered two full grades. A student who misses more than 30% may receive a failing grade and may be dismissed from the program. Exceptions to this policy may be approved by the program director.",
      "url": "",
      "contactEmail": "",
      "addOn": "Course attendance details",
      "source": "2026 KPSAHS Academic Catalog (v.2026-10-23), pp. 121\u2013122"
    },
    {
      "title": "Attendance: Online Classes",
      "appliesTo": "Online classes",
      "program": "",
      "summary": "## Online courses with weekly synchronous class meetings\nAttendance is taken for all synchronous class meetings conducted in the online or on-ground environment.\n## Online courses without a weekly class meeting (asynchronous)\nAttendance is taken weekly. The attendance week begins Monday at 12:00 a.m. Pacific time and ends the following Sunday at 11:59 p.m., except in the final week of the quarter, when it ends Friday at 11:59 p.m. Students are counted present in a given week when at least one of the following occurs:\n- participating in an online webinar such as Zoom, WebEx, or MS Teams\n- submitting an assignment\n- completing a test or quiz\n- posting to a discussion board\n- completing a course evaluation form",
      "url": "",
      "contactEmail": "",
      "addOn": "Course attendance details",
      "source": "2026 KPSAHS Academic Catalog (v.2026-10-23), p. 122"
    },
    {
      "title": "Attendance: Clinical Education",
      "appliesTo": "Clinical courses",
      "program": "",
      "summary": "Attendance will be taken and recorded based on the number of minutes attended. A tardy is defined as arrival after the scheduled start time. Students attending clinical education must meet the physical requirements defined for their program of study.\n## Student responsibilities\nStudents are required to contact the preceptor/clinical instructor or clinical site and the assigned KPSAHS faculty member prior to the scheduled start time. It is the student's responsibility to make up all missed time.\n## Make-up work\nMissed time will be made up in accordance with the approved Program Make-up Agreement.\n## Consequences\nA student who fails to make up time prior to the start of the next quarter will receive an incomplete grade, recorded as \"IC\" on the transcript. The maximum number of allowable absences is outlined in the course syllabus.\n## Clinical hours\nStudents must complete all clinical education hours required by the program of study. KPSAHS and the programmatic accrediting agencies do not permit students to perform more than eight hours per day or a total of 40 hours per week of combined clinical and didactic activities.",
      "url": "",
      "contactEmail": "",
      "addOn": "Course attendance details",
      "source": "2026 KPSAHS Academic Catalog (v.2026-10-23), p. 121"

      "program": "",
      "summary": "- During the add/drop period (the first seven business days of the term), students may drop a course without penalty, and no grade is recorded.\n- After the first seven business days but before the eighth week of the term, students who withdraw from a course receive a \"W.\"\n- Beginning in the eighth week and through the end of the term, students who withdraw receive a grade other than a \"W.\"\nThe date of withdrawal is the student's last day of attendance or the last day of the term in which the student successfully completed coursework, whichever is later.",

    {
      "title": "Academic Honesty",
      "appliesTo": "All courses",
      "program": "",
      "summary": "Honesty is a necessary trait of all health care professionals, and KPSAHS expects all students to practice honest and ethical behavior. All forms of cheating or plagiarism are serious and will not be tolerated. KPSAHS reserves the right to use any process, including software, to determine if plagiarism has occurred. Any student who knowingly cheats, plagiarizes, or allows or aids another student in cheating or plagiarism will receive up to and including:\n- a failing grade on a single assignment and/or final course grade\n- suspension or dismissal from the program\nThe catalog defines plagiarism, cheating, fabrication, aiding/abetting dishonesty, and forgery.",

      "summary": "## Learning management system\nStudents are oriented to the KPSAHS learning management system, KPScholar, during program orientation. Any student not familiar with it will be given access and instruction by the Department of Instructional Innovation and Digital Learning or assigned faculty.\n## Instructor response time\nStudents in KPSAHS distance education courses should expect a response or evaluation for all lessons and projects within ten calendar days of the instructor receiving the submission.\n## Required equipment\n- laptop or desktop running Windows 7 or higher or Mac OS 10.10 or higher (Chromebooks will likely work but may not be consistent enough)\n- Intel i3 or equivalent processor, 2 GHz or higher\n- 2 GB RAM minimum; 4 GB or higher recommended\n- an up-to-date browser such as Chrome or Firefox\n- broadband internet with at least 2 Mbps download and upload speeds\n- webcam and microphone (a headset with microphone is recommended)\n- Microsoft Office Suite",

      "summary": "While in clinical education, students follow KPSAHS and clinical facility policies and procedures, including:\n- accept no gratuities from patients, and inform the instructor/school of any attendance issues\n- get permission from the preceptor/clinical instructor before leaving the clinical site\n- never discuss patient information in public, or a patient's condition with other patients\n- give no medication, water, or treatment except under the direction of a physician\n- wear the photo ID badge at all times on school or clinical site property, and a radiation dosimetry badge if applicable\nClinical assignments are made by the clinical coordinator with the program director, and students may need to travel long distances or rotate between sites. Students in the baccalaureate, phlebotomy, bone densitometry, and medical assisting programs must hold a current American Heart Association BLS CPR card to participate in clinical education. Radiation safety requirements are in the Student Handbook.",

      "summary": "KPSAHS provides individuals with disabilities equal educational opportunities, programs, and services. Students should request reasonable accommodations as soon as possible after acceptance. Documentation must be current (no more than five years old) and from a qualified professional.\n## How to request accommodations\n- Meet with the dean of academic affairs to provide the required documentation. To have accommodations in place for the current quarter, give notice with all required materials within the first two weeks of the quarter.\n- Accommodations cannot be applied retroactively to previous coursework.\n- Approved accommodations are documented in a KPSAHS Letter of Accommodation. Give a copy to your instructors at the beginning of every term.\n- If you feel your accommodations are not being met, contact the program director or the dean of academic affairs.",
